name: 'Prepare offline GeoGebra pad'
description: >
  从仓库 Release 资产拉取 GeoGebra Math Apps Bundle 并解压到目标目录，
  断言入口文件存在（fail-closed）。供 release-android（APK assets）与
  release-windows（C# 安装包内置画板——SP-145 后暂存 dist/geogebra-cache）
  复用——单一修改点，杜绝步骤漂移。
  SP-169（2026-09-26 审计）：原描述仍提 release-windows 的 PyInstaller datas
  用途——单轨 C# 后该用途已不存在，已更正。
inputs:
  dest-dir:
    description: '解压目标目录（相对仓库根）'
    required: true
  release-tag:
    description: 'GeoGebra bundle 的 Release tag'
    required: false
    default: 'resources/geogebra-5.4.929.3'
  zip-sha256:
    description: 'GeoGebra zip 的 SHA256（完整性校验，M-20 修复）'
    required: false
    default: '8855e7577fb766108e3feed1991c42649b691ef4a4d88c2ddb431b893d58811e'
runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GEOGEBRA_DEST_DIR: ${{ inputs.dest-dir }}
        GEOGEBRA_RELEASE_TAG: ${{ inputs.release-tag }}
        GEOGEBRA_ZIP_SHA256: ${{ inputs.zip-sha256 }}
      run: |
        mkdir -p "$GEOGEBRA_DEST_DIR"
        cd "$GEOGEBRA_DEST_DIR"
        gh release download "$GEOGEBRA_RELEASE_TAG" --pattern "*.zip" --output geogebra.zip --clobber
        # M-20 修复（审计 2026-08-31）：外部资源完整性校验（fail-closed）——
        # SHA256 与仓内登记值不符（资产被篡改/仓库被接管）即构建失败，
        # 杜绝未经校验的外部 zip 直接进入 APK / 安装包制品
        echo "$GEOGEBRA_ZIP_SHA256  geogebra.zip" | sha256sum -c - || {
          echo "FAIL: GeoGebra zip SHA256 校验不符——拒绝进入制品链" >&2
          rm -f geogebra.zip
          exit 1
        }
        # SP-209（2026-10-01 审计）：extractall 前做 zip-slip 成员路径断言——
        # SHA256 校验锁的是"今天的 zip 内容"，但 zip 来源是 Release 资产
        # （仓库接管/资产重传场景下哈希会同步换、校验仍过）；绝对路径/
        # ../ 回溯/盘符/反斜杠成员名可在解压时越出 dest-dir 写任意文件
        # （进入 APK/安装包制品链）。检测到即 fail-closed 拒绝解压。
        python - <<'PYEOF'
        import zipfile
        zf = zipfile.ZipFile('geogebra.zip')
        def suspect(name):
            parts = name.replace('\\', '/').split('/')
            return (
                name.startswith('/')
                or name.startswith('\\')
                or '..' in parts
                or (len(parts[0]) > 1 and parts[0][1] == ':')  # Windows 盘符 C:
            )
        bad = [n for n in zf.namelist() if suspect(n)]
        assert not bad, 'zip-slip suspect members (fail-closed): %r' % bad[:5]
        zf.extractall('.')
        PYEOF
        # zip 本身必须删除——残留会被 AGP 打包链/C# 安装包 Content 收进制品（+32MB）
        rm geogebra.zip
        python -c "import os; p='GeoGebra/HTML5/5.0/GeoGebra.html'; assert os.path.isfile(p), 'entry missing: '+p"
        echo "[geogebra] assets ready at $GEOGEBRA_DEST_DIR"
