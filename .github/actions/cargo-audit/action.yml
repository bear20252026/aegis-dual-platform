# PY-171（2026-09-23 审计·V1 核验批）：cargo audit 单源——此前 supply-chain/
# core-rust/release-core 三处 workflow 各自维护安装+执行块（版本漂移面），
# 收敛为本 composite action；升级 cargo-audit 版本只改这里。
# 前置要求：调用方须先装好 Rust 工具链（dtolnay/rust-toolchain）。
name: 'Cargo audit（Rust 依赖审计——供应链门禁）'
description: 'Install pinned cargo-audit and audit core/rust-policy-core (fails on known vulns)'
runs:
  using: 'composite'
  steps:
    - name: Install cargo-audit (pinned)
      shell: bash
      run: cargo install cargo-audit --version 0.22.2 --locked
    - name: cargo audit
      shell: bash
      # 从 git 仓库根解析路径——调用方 job 可能带 defaults.run.working-directory
      #（如 core-rust.yml cargo-gate），相对 cd 在不同 cwd 语义下会双重拼接
      run: cd "$(git rev-parse --show-toplevel)/core/rust-policy-core" && cargo audit
