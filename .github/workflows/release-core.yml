# release-core.yml —— Rust Core 独立交付链（INV-05）
# 独立可追溯：build → sbom → provenance → verify
# 可独立运行（workflow_dispatch）调试友好；release.yml 编排器触发时亦可调用。
#
# ⚠️ 使用前：私有仓库 attestations 需 GitHub Enterprise Cloud

name: Release-Core

on:
  # 编排器（release.yml workflow_call）独占触发——移除 tag 直推双触发面（PY-008）
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  pin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Pin check (fail-closed)
        run: |
          # PY-177/SP-152（2026-09-26 审计）：pin 检查改白名单式并纳入
          # .github/actions/**/action.yml 扫描面（详见 release.yml 同名步骤）
          if grep -rnE '(^|[[:space:]])uses: [^#@]*@' .github/workflows/ .github/actions/ \
              | grep -vE '@[0-9a-fA-F]{40}([[:space:]]|$|#)'; then
            echo "❌ 存在未固定完整 40 位十六进制 SHA 的 action 引用" && exit 1
          fi
          echo "✅ 全部 action 固定完整 SHA"

  quality-gate:
    needs: pin-check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: core/rust-policy-core
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2（quality-gate 编译缓存）
        with:
          workspaces: core/rust-policy-core
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy --locked -D warnings
        run: cargo clippy --locked -- -D warnings
      - name: cargo test --locked
        run: cargo test --locked
      # PY-171（2026-09-23 审计·V1 核验批）：安装+执行块收敛为 composite action 单源
      - uses: ./.github/actions/cargo-audit

  build:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      # PY-054（2026-09-23 审计·V1 核验批）：原批把缓存错加到 quality-gate（另
      # 一 job 不共享 runner）——被点名的 build job 冷编译依旧。此处补齐。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (PY-054)
        with:
          workspaces: core/rust-policy-core
      - name: Build release library
        run: cargo build --release --locked --manifest-path core/rust-policy-core/Cargo.toml
      - name: Collect artifacts + SHA-256
        run: |
          mkdir -p dist
          # PY-192（2026-09-26 审计）：此前三个 cp 全部 `2>/dev/null || true`
          # 吞错——.so 意外缺失时仍静默发布不完整集合。Linux 主机期望产物
          # = .so：断言存在且 cp 失败即 exit 1（bash -e 下裸 cp 失败即中止）。
          # .a/.dll 为非 Linux 主机产物，缺省属预期——保留 best-effort 并注明。
          test -s core/rust-policy-core/target/release/libaegis_policy_core.so \
            || { echo "❌ 缺 libaegis_policy_core.so（Linux 期望产物必须存在）"; exit 1; }
          cp core/rust-policy-core/target/release/libaegis_policy_core.so dist/
          cp core/rust-policy-core/target/release/libaegis_policy_core.a dist/ 2>/dev/null || true
          cp core/rust-policy-core/target/release/aegis_policy_core.dll dist/ 2>/dev/null || true
          # 至少有一个产物
          if [ -z "$(ls -A dist/)" ]; then
            echo "❌ 未找到构建产物" && exit 1
          fi
          python release/build_metadata.py --platform rust-core --output dist/build-metadata.json
          cd dist && sha256sum * > SHA256SUMS.txt
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/**
      - name: Upload Core artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-core
          path: dist/
          if-no-files-found: error

  sbom:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-core
          path: dist
      - name: Generate CycloneDX SBOM (cargo deps)
        uses: anchore/sbom-action@6b31fa7e2d592e47d95d2a5e0520a7352d47ead5
        with:
          path: core/rust-policy-core
          format: cyclonedx-json
          output-file: sbom-core.cdx.json
      # PY-180（2026-09-26 审计）：SBOM 复制进 dist 后重传 build artifact（见
      # 下方 overwrite 重传），使其随 Release 发布；core 平台清单为 txt 格式
      # ——重生成时排除清单自身（否则 verify_checksum 对"未覆盖文件"或
      # 自引用摘要 fail-closed 失败）
      - name: Copy SBOM into dist + regenerate SHA256SUMS.txt (PY-180)
        run: |
          set -e
          cp sbom-core.cdx.json dist/sbom-core.cdx.json
          (cd dist && find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - name: Attest SBOM (bind every artifact)
        uses: actions/attest-sbom@4c8abdcbea4a6b66f70fd1169e70af4bf5b13701
        with:
          subject-path: dist/**
          sbom-path: sbom-core.cdx.json
      # PY-180/PY-179 配套（2026-09-26 审计）：SHA256SUMS.txt 重生成后摘要
      # 已变、SBOM 文件为新增——对最终 dist 重新 attest SLSA provenance，
      # 使 verify 段逐工件 attestation 校验对现摘要成立（同 run signer 一致）
      - name: Re-attest build provenance for final dist (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/**
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-core
          path: sbom-core.cdx.json
      - name: Upload Core artifacts (PY-180：重传含 SBOM 的 dist)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-core
          path: dist/
          if-no-files-found: error
          # PY-180：同名 artifact 覆盖重传（v4 支持）——publish 与 verify-gate
          # 下载到的 release-core 由此包含 SBOM 与重生成后的清单
          overwrite: true

  verify:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-core
          path: dist
      # PY-176/SP-143（2026-09-26 审计）：补 --signer-workflow 固定 signer；
      # SP-153（2026-09-26 审计）：与编排器收敛为同一 composite action（并行度
      # 统一 -P 8）。signer 固定为"本子流 workflow 文件@本次 run ref"
      - name: Verify attestations (SLSA + SBOM)
        uses: ./.github/actions/verify-release-attestations
        with:
          dist-path: dist
          signer-workflow: ${{ github.repository }}/.github/workflows/release-core.yml@${{ github.ref }}
      - name: Checksum reconciliation
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          echo "✅ Rust Core 产物 SHA-256 对账一致"
      - name: Fail-closed gate
        run: echo "✅ Rust Core 平台验证通过"
