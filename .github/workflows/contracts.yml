name: Contracts

"on":
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contract-source-of-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify shared product version declarations
        run: python scripts/verify_versions.py
      - name: Verify cross-end data lists (wallpapers/engines——A-7)
        run: python scripts/verify_cross_end_lists.py
      - name: Validate contracts JSON and expected decisions
        run: |
          python - <<'PYEOF'
          import json, glob, re

          # 单步协议：顶层 expected 字段
          SINGLE_STEP_ACCEPTED = {
              'allow', 'valid', 'deny', 'deny_rollback', 'deny_threshold',
              'deny_expired', 'deny_schema', 'deny_replay'
          }

          # 多步流协议：每步各自的 expected_* 字段
          # 值域：allow / deny / require_confirmation
          MULTI_STEP_ACCEPTED = {'allow', 'deny', 'require_confirmation'}

          # 多步流字段前缀（按协议步骤命名）
          MULTI_STEP_PREFIXES = ('expected_request', 'expected_approve',
                                 'expected_consume', 'expected_evaluate')

          def validate_vector(vector, path):
              """根据协议类型验证向量断言。

              两种协议分类：
              1. 单步协议 — 顶层 'expected' 字段
              2. 多步流协议 — 'expected_request'/'expected_approve'/'expected_consume' 等
              """
              # 单步协议
              if 'expected' in vector:
                  assert vector['expected'] in SINGLE_STEP_ACCEPTED, \
                      f'单步协议 expected 值非法: {path} → {vector["expected"]!r}'
                  return

              # 多步流协议：收集所有 expected_* 字段
              multi_step_fields = [
                  k for k in vector
                  if k.startswith(MULTI_STEP_PREFIXES)
                  and not k.endswith('_code')  # _code 字段是错误码，不是决策
              ]
              assert multi_step_fields, \
                  f'向量缺少断言字段（既无 expected 也无 expected_*）: {path}'

              for field in multi_step_fields:
                  value = vector[field]
                  assert value in MULTI_STEP_ACCEPTED, \
                      f'多步流 {field} 值非法: {path} → {value!r}'

          for path in glob.glob('contracts/schemas/*.json') + glob.glob('contracts/vectors/*.json'):
              data = json.load(open(path, encoding='utf-8'))
              for vector in data.get('vectors', []):
                  validate_vector(vector, path)
          print('✅ contracts JSON 与向量期望有效')
          PYEOF
      - name: Regenerate C# and Kotlin contracts
        run: |
          python contracts/codegen/generate_csharp.py
          python contracts/codegen/generate_kotlin.py
          python contracts/codegen/verify_contract_compatibility.py
      - name: Verify bridge guard JS single source (Rust include_str + Kotlin parity)
        run: python contracts/codegen/verify_bridge_guard.py
      - name: Fail if generated bindings are stale
        run: |
          git diff --exit-code -- \
            windows/src/Aegis.Windows.App/Contracts/Generated \
            android/contracts/src/main/kotlin/com/aegis/contracts/generated

  rust-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/rust-policy-core
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Run Rust policy and vector conformance tests
        run: cargo test --locked

  windows-contract-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Compile Windows broker and generated contracts
        run: dotnet build windows/src/Aegis.Windows.App/Aegis.Windows.App.csproj --configuration Release
      - name: Test Windows Core domain layer
        run: dotnet test windows/tests/Aegis.Windows.Core.Tests/Aegis.Windows.Core.Tests.csproj --configuration Release
      - name: Test Windows broker authorization lifecycle
        run: dotnet test windows/tests/Aegis.Windows.Broker.Tests/Aegis.Windows.Broker.Tests.csproj --configuration Release

  android-contract-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-java@3487f54461fe81d2d61c9e3b374b8504291689fa
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@4d90f943634881869c98b16d759177c8ee849798
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Compile Android modules that consume generated contracts
        run: ./gradlew.bat :contracts:assembleDebug :broker:compileDebugKotlin :webview-adapter:compileDebugKotlin :app:assembleDebug --no-daemon
