name: Contracts

"on":
  push:
    # 审计第六轮（2026-10-03）：删除 paths 过滤——回归 ADR-007 D3 口径
    # （「门禁型 workflow 移除全部 paths: 过滤——paths: 过滤 = 不设防」）。
    # PY-206（2026-09-26）曾重新加回，动机是省 CI（docs 改动也跑契约/cargo/
    # Gradle）。但它制造了真实盲区：本 workflow 的 verify_bridge_guard.py 存在的
    # 唯一理由，是对账
    #   android/**/WebViewHardening.kt 内嵌守卫副本 与
    #   core/rust-policy-core/src/bridge_guard.rs（include_str! 消费）——
    # 而这两条路径都不在过滤清单内。只改这两个文件之一的直接 push，契约门禁
    # 零作业运行，守卫漂移可静默进 master。
    # 代价如实声明：master 每次 push 都跑本 workflow（含 cargo 与双端契约构建）。
    # 正确的省法不是给安全门禁加过滤，而是用分支保护/ruleset 把必需检查设为门禁，
    # 让 CI 成本由合并流程承担，而不是靠让门禁不跑来节省。
    {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read


# PY-044..051：同分支重复 push/PR 取消旧运行（节省 runner 与排队）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract-source-of-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          # SP-201（2026-10-01 审计）：pip 缓存三口径统一——contracts 此前用
          # actions/cache 静态键（锁文件更新不失效缓存）、supply-chain/
          # agent-redteam 无缓存。统一 setup-python 内建 cache: pip + 锁文件
          # 驱动 cache-dependency-path（三 workflow 同口径）。
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install contracts toolchain (PY-178 完整化——hash 锁定单源)
        # PY-178（2026-09-26 审计收尾批）：此前行内 == pin（且 jsonschema/pyyaml
        # 与 requirements-ci 漂移 4.23/6.0.2 vs 4.26/6.0.3）——统一根
        # requirements-ci.txt --require-hashes（传递依赖全 hash 锁定）
        run: python -m pip install --require-hashes -r requirements-ci.txt -q
      # PY-222（2026-10-01 审计）：发布链验证器 207 项 pytest 此前只在周
      # cron（legacy-python-guard）跑——tag 发布窗口零 pytest，工具回归不可
      # 见。接线到常跑契约门禁（PY-221 同批为锁补 cryptography——本步骤
      # 经 requirements-ci.txt hash 锁一并安装）。
      - name: pwsh step exit-code gate (R7-TOOL-01——含故障注入自证)
        # 审计第七轮：`shell: pwsh` 下原生命令非零不中断脚本，步骤退出码取末条
        # 原生命令——发布链曾因此「测试红 + 构建绿 ⇒ 步骤绿」。本步骤核全部 workflow
        # 的 pwsh 步骤，并植入一个违规样本自证它能红（--self-test）。
        # 注：本步骤属既有 job（contract-source-of-truth，已是必需检查），
        # 不新增 context 名 → 不影响 merge box。
        run: python scripts/check_workflow_shells.py --self-test
      - name: Release-chain unit tests (PY-222——tests/python 常跑)
        # SP-258（2026-10-02 审计）：--cov 出覆盖率报告（不设阈值，供补测排序）。
        # coverage 的 source 面只接受包/目录——validate_release.py 根级单文件
        # 不入测量面（其 AST 门禁自身有独立对账）
        run: python -m pytest tests/python -q --cov=scripts --cov=release --cov=contracts --cov=agent --cov-report=term-missing:skip-covered
      # SP-239（PY-263 接线，2026-10-02 审计）：活跃树 ruff/bandit 此前仅周六
      # cron（legacy-python-guard）低频跑——push/PR 零覆盖。本 job 已装
      # requirements-ci.txt（含 ruff/bandit pin），直接调单源脚本（push 与
      # PR 触发面均生效）。命令行单源：scripts/active_tree_gates.py。
      - name: Active-tree ruff gate (PY-263——活跃树 lint 单源)
        run: python scripts/active_tree_gates.py ruff
      - name: Active-tree bandit gate (PY-263——活跃树 SAST 单源，Medium/High 失败)
        run: python scripts/active_tree_gates.py bandit
      # PR #82 实测教训：本地 Python 3.14 全绿、CI 钉 3.12 直接 TypeError
      #（Path.read_text 的 newline 关键字是 3.13+）——版本差异类缺陷只有按
      # CI 钉版扫描才看得见，故与 ruff/bandit 同面常跑。
      - name: Active-tree Python 3.12 compat gate (CI 钉版 vs 本地高版本漂移面)
        run: python scripts/active_tree_gates.py compat
      # SP-255（2026-10-02 审计·I-03）：行数红线（新文件 ≤300 / 改造后 ≤500）
      # + 基线 ratchet——基线外文件按 300 红线，基线内文件只许减不许增
      - name: File size red line gate (SP-255——行数红线 + 基线 ratchet)
        run: python scripts/check_file_sizes.py
      # SP-256（2026-10-02 审计·I-19）：全仓 *.md 相对链接目标存在性——
      # 死链 fail-closed（http/mailto/锚点/代码块内链接不在校验面）
      - name: Markdown relative link gate (SP-256——死链 fail-closed)
        run: python scripts/check_markdown_links.py
      # B8（第八轮 2026-10-04）：文档里的 workflow 数量是**陈述**，实树变化后没人回头
      # 改——同一件事三轮复发（WB-214 对齐为 13 → 第六轮记「闭环即回归」→ 第八轮实测
      # 仍有 8 处与实树不符）。本门禁把「文档说的数 = 实树的数」变成可失败检查。
      - name: Doc claim reconciliation gate (B8——计数声明与实树对账)
        run: python scripts/check_doc_claims.py
      - name: Verify shared product version declarations
        run: python scripts/verify_versions.py
      - name: Verify release.json against full schema (PY-102——14 字段漂移门禁)
        run: python scripts/verify_release_schema.py
      - name: Repo-level release integrity validator (审计第六轮 2026-10-03)
        # README 把 validate_release.py 列为「五门禁常绿」之一，但此前它
        # 的唯一 CI 执行点是 legacy-python-guard.yml 的周六 cron 与 compat.yml
        # 的每周探针——push / PR 与发布路径都不跑，回归要等到打 tag 才可见
        #（241 轮 SP-199 已承认 7 个常跑门禁不含它）。接入本 job 使「常绿」
        # 名副其实：改动脚本本体或依赖锁时同批回验。
        run: python validate_release.py
      - name: Verify cross-end data lists (wallpapers/engines——A-7)
        run: python scripts/verify_cross_end_lists.py
      - name: Validate contracts JSON and expected decisions (PY-064 抽脚本单源)
        run: python scripts/verify_vectors.py
      - name: Validate vectors against JSON Schema (PY-013——schema 不再纯装饰)
        run: python contracts/codegen/validate_vector_schemas.py
      - name: Analyze action catalog (PY-015——静态分析器接入门禁)
        run: python contracts/codegen/analyze_action_catalog.py
      - name: Regenerate C# and Kotlin contracts
        run: |
          python contracts/codegen/generate_csharp.py
          python contracts/codegen/generate_kotlin.py
          python contracts/codegen/verify_contract_compatibility.py
      - name: Verify bridge guard JS single source (Rust include_str + Kotlin parity)
        run: python contracts/codegen/verify_bridge_guard.py
      - name: Verify seed framing parity (R7-CS1-05/R7-CS2-10——顶层框定 + 后缀清单单源)
        run: python contracts/codegen/verify_seed_framing_parity.py
      - name: Regenerate jsapi schema and fail on drift (PY-014——生成器接入门禁)
        run: |
          python scripts/gen_jsapi_schema.py
          git diff --exit-code -- shared/jsapi-schema.json
      - name: Fail if generated bindings are stale
        run: |
          git diff --exit-code -- \
            windows/src/Aegis.Windows.App/Contracts/Generated \
            android/contracts/src/main/kotlin/com/aegis/contracts/generated

  rust-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: core/rust-policy-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (PY-052)
        with:
          workspaces: core/rust-policy-core
      - name: Run Rust policy and vector conformance tests
        # SP-226（2026-10-02 审计·S-05）：补 --all-features——与 core-rust.yml
        # 统一口径（feature 门控代码此前在本 conformance 面逃检）
        run: cargo test --locked --all-features

  windows-contract-build:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # SP-244（2026-10-02 审计·S-21）：actions/cache 双主版本并存（本文件与
      # release-windows.yml 的 v4.3.0 vs native-policy/release-android 的 v6.1.0）
      # ——统一 v6.1.0（git ls-remote 核对 tag SHA）
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          # SP-177（2026-10-01 审计落地）：packages.lock.json 已入库——
          # 缓存键随锁文件内容失效；下方 build/test 以 RestoreLockedMode 消费。
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/**/*.csproj', 'windows/**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Compile Windows broker and generated contracts
        run: dotnet build windows/src/Aegis.Windows.App/Aegis.Windows.App.csproj --configuration Release -r win-x64 -p:RestoreLockedMode=true
      - name: Test Windows Core domain layer
        run: dotnet test windows/tests/Aegis.Windows.Core.Tests/Aegis.Windows.Core.Tests.csproj --configuration Release -r win-x64 -p:RestoreLockedMode=true
      - name: Test Windows broker authorization lifecycle
        run: dotnet test windows/tests/Aegis.Windows.Broker.Tests/Aegis.Windows.Broker.Tests.csproj --configuration Release -r win-x64 -p:RestoreLockedMode=true

  android-contract-build:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1 (SP-178 重 pin)
        with:
          distribution: temurin
          java-version: '21'
          # SP-215（2026-10-01 审计）：Gradle 缓存统一 setup-java cache: gradle
          # 单机制——cache-dependency-path 与 android-quality/release-android
          # 同源（含 libs.versions.toml，AD-243/SP-184 口径）
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/**
            android/gradle/libs.versions.toml
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4 (SP-178 重 pin)
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Compile Android modules that consume generated contracts
        run: ./gradlew.bat :contracts:assembleDebug :broker:compileDebugKotlin :webview-adapter:compileDebugKotlin :app:assembleDebug --no-daemon
