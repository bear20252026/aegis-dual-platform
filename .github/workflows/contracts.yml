name: Contracts

"on":
  push:
    # PY-206（2026-09-26 审计）：push 触发补 paths 过滤——此前 push: {} 全
    # 分支全路径触发，docs 改动也全量跑契约/Gradle/cargo 门禁（PR 触发面
    # 保持不过滤：PR 需要完整反馈）
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - 'shared/**'
      # 本 workflow 以 --require-hashes 安装根级 hash 锁——锁变更须回验
      - 'requirements-ci.in'
      - 'requirements-ci.txt'
      - '.github/workflows/contracts.yml'
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read


# PY-044..051：同分支重复 push/PR 取消旧运行（节省 runner 与排队）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract-source-of-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 (PY-061)
        with:
          path: ~/.cache/pip
          key: pip-contracts-${{ runner.os }}-reqci-hashlock-v1
      - name: Install contracts toolchain (PY-178 完整化——hash 锁定单源)
        # PY-178（2026-09-26 审计收尾批）：此前行内 == pin（且 jsonschema/pyyaml
        # 与 requirements-ci 漂移 4.23/6.0.2 vs 4.26/6.0.3）——统一根
        # requirements-ci.txt --require-hashes（传递依赖全 hash 锁定）
        run: python -m pip install --require-hashes -r requirements-ci.txt -q
      - name: Verify shared product version declarations
        run: python scripts/verify_versions.py
      - name: Verify release.json against full schema (PY-102——14 字段漂移门禁)
        run: python scripts/verify_release_schema.py
      - name: Verify cross-end data lists (wallpapers/engines——A-7)
        run: python scripts/verify_cross_end_lists.py
      - name: Validate contracts JSON and expected decisions (PY-064 抽脚本单源)
        run: python scripts/verify_vectors.py
      - name: Validate vectors against JSON Schema (PY-013——schema 不再纯装饰)
        run: python contracts/codegen/validate_vector_schemas.py
      - name: Analyze action catalog (PY-015——静态分析器接入门禁)
        run: python contracts/codegen/analyze_action_catalog.py
      - name: Regenerate C# and Kotlin contracts
        run: |
          python contracts/codegen/generate_csharp.py
          python contracts/codegen/generate_kotlin.py
          python contracts/codegen/verify_contract_compatibility.py
      - name: Verify bridge guard JS single source (Rust include_str + Kotlin parity)
        run: python contracts/codegen/verify_bridge_guard.py
      - name: Regenerate jsapi schema and fail on drift (PY-014——生成器接入门禁)
        run: |
          python scripts/gen_jsapi_schema.py
          git diff --exit-code -- shared/jsapi-schema.json
      - name: Fail if generated bindings are stale
        run: |
          git diff --exit-code -- \
            windows/src/Aegis.Windows.App/Contracts/Generated \
            android/contracts/src/main/kotlin/com/aegis/contracts/generated

  rust-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: core/rust-policy-core
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (PY-052)
        with:
          workspaces: core/rust-policy-core
      - name: Run Rust policy and vector conformance tests
        run: cargo test --locked

  windows-contract-build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 (PY-058)
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/**/*.csproj', 'windows/**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Compile Windows broker and generated contracts
        run: dotnet build windows/src/Aegis.Windows.App/Aegis.Windows.App.csproj --configuration Release
      - name: Test Windows Core domain layer
        run: dotnet test windows/tests/Aegis.Windows.Core.Tests/Aegis.Windows.Core.Tests.csproj --configuration Release
      - name: Test Windows broker authorization lifecycle
        run: dotnet test windows/tests/Aegis.Windows.Broker.Tests/Aegis.Windows.Broker.Tests.csproj --configuration Release

  android-contract-build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-java@97c5a5e13aa773f277f72c1287dda3c789f1366c
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle  # PY-062
      - uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Compile Android modules that consume generated contracts
        run: ./gradlew.bat :contracts:assembleDebug :broker:compileDebugKotlin :webview-adapter:compileDebugKotlin :app:assembleDebug --no-daemon
