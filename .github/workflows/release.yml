# release.yml —— Aegis 发布编排器（INV-05 独立交付链）
#
# 编排器模式：
#   pin-check → [Windows/Android/Core 三平台并行] → verify-gate → publish
#
# 每平台独立 workflow（release-windows/android/core.yml），
# 本文件仅负责：①SHA pin 检查 ②调用三平台 ③聚合验证 ④发布。
#
# ⚠️ 使用前：①配置 GitHub Environment "release"（required reviewer）
#  ②受保护 v* 标签规则集 ③私有仓库 attestations 需 GitHub Enterprise Cloud

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: SHA pin 检查（fail-closed）
  # ──────────────────────────────────────────────
  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Pin check (fail-closed)
        run: |
          if grep -rnE 'uses: [^#]+@[0-9a-f]{1,39}[^0-9a-f#]|uses: [^#]+@(main|master|v[0-9])' \
              .github/workflows/ docs/release/release.yml; then
            echo "❌ 存在未固定 SHA 的 action 引用" && exit 1
          fi
          echo "✅ 全部 action 固定完整 SHA"
      - name: 评审包生成器自检（dry-run 到临时目录）
        # A-4（架构审计 2026-08-31）：评审包不再作为快照入库——改为
        # 发布时从规范源码自动生成（见 publish 的 review-package 步骤），
        # 杜绝快照随主仓库推进而漂移。此处仅验证生成器可运行。
        run: python3 scripts/build_review_package.py --build --out /tmp/review-pkg-dryrun

  # ──────────────────────────────────────────────
  # Stage 2: 三平台并行构建（可重用 workflow 调用）
  # ──────────────────────────────────────────────
  release-windows:
    needs: pin-check
    uses: ./.github/workflows/release-windows.yml
    permissions:
      id-token: write
      attestations: write
      contents: read

  release-android:
    needs: pin-check
    uses: ./.github/workflows/release-android.yml
    permissions:
      id-token: write
      attestations: write
      contents: read

  release-core:
    needs: pin-check
    uses: ./.github/workflows/release-core.yml
    permissions:
      id-token: write
      attestations: write
      contents: read

  # ──────────────────────────────────────────────
  # Stage 3: 聚合验证门禁（fail-closed——三平台全通过才放行）
  # ──────────────────────────────────────────────
  verify-gate:
    needs: [release-windows, release-android, release-core]
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      # 下载三平台产物
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-windows
          path: dist/windows
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-android
          path: dist/android
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-core
          path: dist/core

      # 验证所有产物的 SLSA provenance
      - name: Verify SLSA provenance (all platforms)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f -print0 | xargs -0 -P 8 -I{} timeout 60 \
            gh attestation verify "{}" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --predicate-type https://slsa.dev/provenance/v1

      # 验证所有产物的 SBOM attestation
      - name: Verify SBOM attestation (all platforms)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f -print0 | xargs -0 -P 8 -I{} timeout 60 \
            gh attestation verify "{}" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --predicate-type https://cyclonedx.org/bom

      # SHA-256 对账（字节一致不变量）
      - name: Checksum reconciliation (byte-identical invariant)
        run: |
          python - <<'PY'
          import json, hashlib, pathlib
          for platform in ['windows', 'android', 'core']:
              sha_file = pathlib.Path(f"dist/{platform}/SHA256SUMS.json")
              if not sha_file.exists():
                  # Core 使用 SHA256SUMS.txt
                  sha_txt = pathlib.Path(f"dist/{platform}/SHA256SUMS.txt")
                  if sha_txt.exists():
                      print(f"✅ {platform}: SHA256SUMS.txt 存在（跳过 JSON 对账）")
                      continue
                  print(f"⚠️ {platform}: 无校验文件（跳过）")
                  continue
              sums = json.loads(sha_file.read_text())
              for entry in sums:
                  p = pathlib.Path(f"dist/{platform}") / pathlib.Path(entry["Path"].replace("\\", "/"))
                  h = hashlib.sha256(p.read_bytes()).hexdigest().upper()
                  assert h == entry["Hash"], f"校验失败: {p}"
              print(f"✅ {platform}: SHA-256 对账一致")
          print("✅ 全平台 SHA-256 对账一致（字节一致）")
          PY

      - name: Fail-closed gate
        run: echo "✅ 三平台验证通过——允许发布（任一失败此处不会到达）"

  # ──────────────────────────────────────────────
  # Stage 4: 发布（tag-gated + 受保护环境审批）
  # ──────────────────────────────────────────────
  publish:
    needs: verify-gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      # 下载三平台产物
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-windows
          path: dist/windows
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-android
          path: dist/android
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-core
          path: dist/core

      - name: 从规范源码生成评审包（A-4：发布时生成，不再入库）
        run: python scripts/build_review_package.py --build --out dist/review-package

      - name: Create GitHub Release (all platforms)
        uses: softprops/action-gh-release@d1e66170d32c9ec7bbcb7fae044d3d686ce304d3
        with:
          files: |
            dist/**
          generate_release_notes: true
