# release.yml —— Aegis 发布编排器（INV-05 独立交付链）
#
# 编排器模式：
#   pin-check → [Windows/Android/Core 三平台并行] → verify-gate → publish
#
# 每平台独立 workflow（release-windows/android/core.yml），
# 本文件仅负责：①SHA pin 检查 ②调用三平台 ③聚合验证 ④发布。
#
# ⚠️ 使用前：①配置 GitHub Environment "release"（required reviewer）
#  ②受保护 v* 标签规则集 ③私有仓库 attestations 需 GitHub Enterprise Cloud

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: SHA pin 检查（fail-closed）
  # ──────────────────────────────────────────────
  pin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Pin check (fail-closed)
        run: |
          if grep -rnE 'uses: [^#]+@[0-9a-f]{1,39}[^0-9a-f#]|uses: [^#]+@(main|master|v[0-9])' \
              .github/workflows/ docs/release/release.yml; then
            echo "❌ 存在未固定 SHA 的 action 引用" && exit 1
          fi
          echo "✅ 全部 action 固定完整 SHA"
      - name: 评审包生成器自检（dry-run 到临时目录）
        # A-4（架构审计 2026-08-31）：评审包不再作为快照入库——改为
        # 发布时从规范源码自动生成（见 publish 的 review-package 步骤），
        # 杜绝快照随主仓库推进而漂移。此处仅验证生成器可运行。
        run: |
          python3 scripts/build_review_package.py --build --out /tmp/review-pkg-dryrun
          # 审计修复：--check 此前无任何调用方（"保证与源码同步"的声明不成立）
          # ——dry-run 产物立即做自校验，manifest 完整性随门禁验证
          python3 scripts/build_review_package.py --check --out /tmp/review-pkg-dryrun

  # ──────────────────────────────────────────────
  # Stage 2: 三平台并行构建（可重用 workflow 调用）
  # ──────────────────────────────────────────────
  release-windows:
    needs: pin-check
    uses: ./.github/workflows/release-windows.yml
    secrets: inherit
    permissions:
      id-token: write
      attestations: write
      contents: read

  release-android:
    needs: pin-check
    uses: ./.github/workflows/release-android.yml
    # 签名根因修复（v2.1.12 实测）：可复用工作流不会自动继承 secrets——
    # 不传 inherit 时被调方 secrets.AEGIS_KEYSTORE_* 全为空 → 静默走
    # 「未签名 APK」warning 路径，无签名包被 publish 上 Release（真机安装报
    # INSTALL_PARSE_FAILED_NO_CERTIFICATES）。三平台统一 inherit 防回归。
    secrets: inherit
    permissions:
      id-token: write
      attestations: write
      contents: read

  release-core:
    needs: pin-check
    uses: ./.github/workflows/release-core.yml
    secrets: inherit
    permissions:
      id-token: write
      attestations: write
      contents: read

  # ──────────────────────────────────────────────
  # Stage 3: 聚合验证门禁（fail-closed——三平台全通过才放行）
  # ──────────────────────────────────────────────
  verify-gate:
    needs: [release-windows, release-android, release-core]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      # 下载三平台产物
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-windows
          path: dist/windows
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-android
          path: dist/android
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-core
          path: dist/core

      # 验证所有产物的 SLSA provenance
      - name: Verify SLSA provenance (all platforms)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f -print0 | xargs -0 -P 8 -I{} timeout 60 \
            gh attestation verify "{}" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --predicate-type https://slsa.dev/provenance/v1

      # 验证所有产物的 SBOM attestation
      - name: Verify SBOM attestation (all platforms)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f -print0 | xargs -0 -P 8 -I{} timeout 60 \
            gh attestation verify "{}" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --predicate-type https://cyclonedx.org/bom

      # SHA-256 对账（字节一致不变量）
      - name: Checksum reconciliation (byte-identical invariant)
        run: |
          # 审计修复：fail-closed——校验文件缺失/空清单/未列明文件均为门禁失败
          python - <<'PY'
          import json, hashlib, pathlib
          failed = False
          for platform in ["windows", "android", "core"]:
              root = pathlib.Path(f"dist/{platform}")
              sha_file = root / "SHA256SUMS.json"
              if not sha_file.exists():
                  # Core 平台允许 SHA256SUMS.txt（逐行 "<hash>  <name>"）——
                  # 但必须同样真实对账，不再"存在即通过"
                  sha_txt = root / "SHA256SUMS.txt"
                  if not sha_txt.exists():
                      print(f"❌ {platform}: 无任何校验文件（fail-closed）"); failed = True; continue
                  entries = {}
                  for line in sha_txt.read_text().splitlines():
                      parts = line.split(None, 1)
                      if len(parts) == 2:
                          entries[parts[1].lstrip("*")] = parts[0].upper()
                  if not entries:
                      print(f"❌ {platform}: SHA256SUMS.txt 为空清单"); failed = True; continue
                  for name, expected in entries.items():
                      f = root / name
                      if not f.exists():
                          print(f"❌ {platform}: 清单文件缺失 {name}"); failed = True; continue
                      actual = hashlib.sha256(f.read_bytes()).hexdigest().upper()
                      if actual != expected:
                          print(f"❌ {platform}: 校验失败 {name}"); failed = True
                  print(f"✅ {platform}: SHA256SUMS.txt 对账一致（{len(entries)} 项）")
                  continue
              sums = json.loads(sha_file.read_text())
              if not isinstance(sums, list) or not sums:
                  print(f"❌ {platform}: SHA256SUMS.json 为空清单（fail-closed）"); failed = True; continue
              listed = set()
              for entry in sums:
                  rel = entry["Path"].replace("\\", "/")
                  p_ = root / pathlib.Path(rel)
                  h = hashlib.sha256(p_.read_bytes()).hexdigest().upper()
                  assert h == entry["Hash"], f"校验失败: {p_}"
                  listed.add(rel)
              # 反向覆盖：目录内除清单/元数据外不得有未列明文件
              for f in root.rglob("*"):
                  if not f.is_file():
                      continue
                  rel = f.relative_to(root).as_posix()
                  if rel in listed or rel == "SHA256SUMS.json" or rel.endswith("/SHA256SUMS.json"):
                      continue
                  if rel == "build-metadata.json":
                      continue
                  print(f"❌ {platform}: 未列明文件 {rel}"); failed = True
              print(f"✅ {platform}: SHA-256 对账一致（{len(listed)} 项，全覆盖）")
          if failed:
              raise SystemExit(1)
          print("✅ 全平台 SHA-256 对账一致（字节一致，fail-closed）")
          PY

      - name: Fail-closed gate
        run: echo "✅ 三平台验证通过——允许发布（任一失败此处不会到达）"

  # ──────────────────────────────────────────────
  # Stage 4: 发布（tag-gated + 受保护环境审批）
  # ──────────────────────────────────────────────
  publish:
    needs: verify-gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      # 下载三平台产物
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-windows
          path: dist/windows
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-android
          path: dist/android
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-core
          path: dist/core
      - name: 从规范源码生成评审包（A-4：发布时生成，不再入库）
        run: python scripts/build_review_package.py --build --out dist/review-package

      # 评审包 ~300 个规范源文件，必须压成单 zip 再上传——
      # 否则 files: dist/** 会把每个源文件逐个发布成 Release 资产（v2.1.10 实测 318 个垃圾资产）
      - name: 打包评审包为单 zip
        run: |
          cd dist
          zip -qr "Aegis-${GITHUB_REF_NAME#v}-review-package.zip" review-package
          rm -rf review-package

      # 三平台 dist 目录存在同名文件（build-metadata.json / SHA256SUMS.json 等）——
      # softprops 对重复上传走 update-metadata 路径，GitHub API 404 竞态导致步骤失败（v2.1.11 实测）
      - name: 跨平台同名资产去重（加平台前缀）
        run: python scripts/dedup_release_assets.py dist/windows dist/android dist/core
      # 审计修复：去重发生在各平台 checksum 生成之后——改名必须重生成清单，
      # 否则 Release 资产名与 SHA256SUMS.json 条目不再对应
      - name: 去重后重生成各平台 SHA-256 清单
        run: |
          for platform in windows android core; do
            if [ -f "dist/$platform/SHA256SUMS.json" ]; then
              python release/write_checksum_json.py --root "dist/$platform" --output "dist/$platform/SHA256SUMS.json"
            elif [ -f "dist/$platform/SHA256SUMS.txt" ]; then
              (cd "dist/$platform" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
            fi
          done

      - name: Create GitHub Release (all platforms)
        uses: softprops/action-gh-release@d1e66170d32c9ec7bbcb7fae044d3d686ce304d3
        with:
          files: |
            dist/**
          generate_release_notes: true
