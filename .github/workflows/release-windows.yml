# release-windows.yml —— 现役 C# / WPF + WebView2 交付链（build → SBOM → provenance → verify）
name: Release-Windows

"on":
  push:
    tags: ['v*']
    paths:
      - 'windows/src/Aegis.Windows.App/**'
      - '.github/workflows/release-windows.yml'
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Pin check (fail-closed)
        run: |
          if grep -rnE 'uses: [^#]+@[0-9a-f]{1,39}[^0-9a-f#]|uses: [^#]+@(main|master|v[0-9])' .github/workflows/release-windows.yml; then
            echo "❌ 存在未固定 SHA 的 action 引用" && exit 1
          fi
          echo "✅ 全部 action 固定完整 SHA"

  build:
    needs: pin-check
    runs-on: windows-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Verify shared version and release tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            python scripts/verify_versions.py --tag "${{ github.ref_name }}"
          } else {
            python scripts/verify_versions.py
          }
      - name: Build versioned Rust navigation decision DLL
        shell: pwsh
        run: |
          cargo build --manifest-path core/rust-policy-core/Cargo.toml --release --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path dist/native-policy/windows/win-x64
          Copy-Item core/rust-policy-core/target/x86_64-pc-windows-msvc/release/aegis_policy_core.dll `
            dist/native-policy/windows/win-x64/aegis_policy_core.dll
      - name: Verify native bridge and build current Windows application
        shell: pwsh
        run: |
          $policyDll = (Resolve-Path dist/native-policy/windows/win-x64/aegis_policy_core.dll).Path
          $env:AEGIS_REQUIRE_NATIVE_POLICY_CORE = "1"
          $env:AEGIS_REQUIRE_NAVIGATION_CONFIRMATION = "1"
          $env:AEGIS_NATIVE_POLICY_CORE_PATH = $policyDll
          $env:AEGIS_NATIVE_POLICY_CORE_TEST_PATH = $policyDll
          dotnet test windows/tests/Aegis.Windows.Broker.Tests/Aegis.Windows.Broker.Tests.csproj --configuration Release
          dotnet publish windows/src/Aegis.Windows.App/Aegis.Windows.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output dist/aegis-windows `
            -p:RequireNativePolicyCore=true `
            -p:NativePolicyCorePath=$policyDll
          if (-not (Test-Path dist/aegis-windows/aegis_policy_core.dll)) {
            throw "Windows 发布目录缺少 Rust 原生策略核心 DLL"
          }
          Compress-Archive -Path dist/aegis-windows/* -DestinationPath dist/Aegis.Windows.zip -Force
      - name: Install Inno Setup 6 (C# installer)
        run: choco install innosetup -y --no-progress
      - name: Build C# installer (ADR-009 beta channel — version injected from single source)
        shell: pwsh
        run: |
          $version = ((Get-Content shared/version.properties) | Where-Object { $_ -match '^VERSION_NAME=' }) -replace '^VERSION_NAME=', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersionOverride=$version docs\release\AegisSetup-CSharp.iss
          if ($LASTEXITCODE -ne 0) { throw "C# installer compilation failed" }
          if (-not (Test-Path "dist/AegisBrowser-CSharp-Setup-$version.exe")) { throw "C# installer not generated" }
      - name: Write build metadata
        run: python release/build_metadata.py --platform windows --output dist/build-metadata.json
      - name: Generate SHA-256 checksums
        run: python release/write_checksum_json.py --root dist --output dist/SHA256SUMS.json
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/**
      - name: Upload current Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-windows
          path: dist/
          if-no-files-found: error

  sbom:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-windows
          path: dist
      - name: Generate CycloneDX SBOM for current C# application
        uses: anchore/sbom-action@52542941bb775adef77f7a51ff5ea984e600fab8
        with:
          path: windows/src/Aegis.Windows.App
          format: cyclonedx-json
          output-file: sbom-windows.cdx.json
      - name: Attest SBOM (bind every artifact)
        uses: actions/attest-sbom@5729fe4dc697fb7538e4e94fd44d040aac1367b2
        with:
          subject-path: dist/**
          sbom-path: sbom-windows.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-windows
          path: sbom-windows.cdx.json

  verify:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-windows
          path: dist
      - name: Verify SLSA provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f -print0 | xargs -0 -P 4 -I{} timeout 60 gh attestation verify "{}" --owner "$GITHUB_REPOSITORY_OWNER" --predicate-type https://slsa.dev/provenance/v1
      - name: Verify SBOM attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f -print0 | xargs -0 -P 4 -I{} timeout 60 gh attestation verify "{}" --owner "$GITHUB_REPOSITORY_OWNER" --predicate-type https://cyclonedx.org/bom
      - name: Checksum reconciliation
        run: python release/verify_checksum_json.py --root dist --manifest dist/SHA256SUMS.json

  installer-pywebview:
    name: Windows 功能栈安装包（PyInstaller + Inno Setup）
    # 现役功能栈（legacy/windows-pywebview——ADR-007）的可执行安装器：
    # PyInstaller onedir（aegis_webview.spec）→ Inno Setup（docs/release/AegisSetup.iss）
    # M-21 修复（审计 2026-08-31）：补 needs:pin-check + SHA256SUMS +
    # SLSA attestation——安装器 EXE 是最终分发制品，必须与主 build 同入
    # 供应链验证链（此前完全游离于 attestation/校验之外）
    needs: pin-check
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14'
      - name: 安装打包依赖（requirements 锁定 pywebview/pyinstaller）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r legacy/windows-pywebview/requirements.txt -r legacy/windows-pywebview/requirements-dev.txt types-pywin32
      - name: 准备离线几何画板资源（GeoGebra Math Apps Bundle）
        uses: ./.github/actions/prepare-geogebra
        with:
          dest-dir: legacy/windows-pywebview/geogebra
      - name: PyInstaller 打包（onedir——dist/AegisWebView）
        working-directory: legacy/windows-pywebview
        run: python -m PyInstaller aegis_webview.spec --noconfirm --distpath dist --workpath build
      - name: 安装 Inno Setup 6
        run: choco install innosetup -y --no-progress
      - name: 编译安装包（版本号由 shared/version.properties 单源，sync_versions.py 写入 iss）
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" docs\release\AegisSetup.iss'
      - name: 安装包 SHA-256 清单（M-21）
        run: python release/write_checksum_json.py --root docs/release/installer_output --output docs/release/installer_output/SHA256SUMS.json
      - name: Attest installer provenance (SLSA)（M-21）
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: docs/release/installer_output/**
      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-windows-installer
          path: docs/release/installer_output/*.exe
          if-no-files-found: error
