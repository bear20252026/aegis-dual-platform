# Aegis CI —— 双端代码质量检查
# 触发：push 到 master / 任意 pull request
# 检查项：validate_release / ruff / bandit / mypy（Windows 源码 + 校验脚本）
#         + UI 回归（start.html 已知缺陷断言）
# 说明：Android（ktlint/detekt/单测）由 android-quality.yml 门禁、
#       C#（dotnet build/test）由 contracts.yml 门禁——均为全量 PR/push
#       触发，本文件不再重复（全库审计 2026-09-02：删除 android-lint 占位 job——
#       原内容为纯 echo，名为门禁实为摆设）。

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python-checks:
    name: Python 质量检查（ruff / bandit / mypy / validate_release）
    # 必须 windows-latest：Aegis 是 Windows 应用，mypy 检查的 winreg/
    # ctypes.windll 仅在 Windows 有类型桩；Linux 上会误报（P6 教训延伸：
    # CI 平台须与目标/本地环境一致）
    runs-on: windows-latest
    # PYTHONUTF8=1：Windows 默认 charmap 编码无法编码中文输出（如 validate_release.py
    # 的「缺」字）——强制 Python 用 UTF-8，避免 UnicodeEncodeError
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: legacy/windows-pywebview
    steps:
      - name: 检出代码
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: 安装 Python 3.14
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (node24)
        with:
          python-version: "3.14"

      - name: 安装检查工具
        # 全量安装：requirements.txt（运行依赖，含 PySide6——asset_scheme
        # 的 mypy 检查需要其类型桩）+ requirements-dev.txt（== 锁定版本，
        # P6 教训：CI 与本地口径一致）+ types-pywin32（security.py 桩）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt types-pywin32

      - name: 静态验证（AST / JSON / XML / 版本声明）
        run: python ../../validate_release.py

      - name: ruff 检查（Lint + 格式，0 错误）
        # 工作目录为 legacy/windows-pywebview，`--exclude legacy` 排除其下的旧 Qt 栈归档
        # legacy/windows-pywebview/legacy/**（61 个 Python 不参与运行面——全量扫描会误报
        # 11 处存量风格问题）；其余为活跃新栈（app/ + main_webview.py + selftest）。
        run: ruff check . --exclude legacy --ignore RUF001,RUF003,E501,TRY300,TRY003,TRY301,RUF021,E402,I001

      - name: bandit 安全扫描（无 Medium/High）
        # 设计豁免规则（见 docs/KNOWLEDGE_BASE.md「P6 bandit 豁免」）：
        # - B110 try_except_pass：静默降级是安全设计
        # - B404/B603/B607 subprocess：均为参数列表 + shell=False 的受控
        #   调用（security.py icacls / webview2_probe.py tasklist），无注入面
        # 其余规则 Medium/High 触发失败（bandit 退出码即门禁）。
        run: bandit -r app/ -q --skip B110,B404,B603,B607

      - name: mypy 类型检查（新栈 0 错误）
        shell: bash
        run: |
          mypy main_webview.py \
            app/api_bridge.py app/nav_queue.py app/shell_toolbar.py \
            app/config.py app/threat_feed.py app/asset_scheme.py \
            app/paths.py app/bookmark_store.py app/history_store.py \
            app/database.py app/security.py app/backdrop.py \
            app/fingerprint_pipeline.py app/bridge_hooks.py \
            crash_reporter.py --exclude "System Volume Information"

      - name: 自检脚本（session_store / api_bridge / s1 集成 / shell_toolbar / tab_state / navigation_search）
        # 门禁全量常跑（ADR-007）：CLAUDE.md 要求改动后必跑的 5 个离线自检
        # 全部入 CI——自检与实现不一致（master 曾双 FAIL）在合入前即暴露
        run: |
          python selftest_session_store.py
          python selftest_api_bridge.py
          python selftest_s1_integration.py
          python selftest_shell_toolbar.py
          python selftest_tab_state.py
          python selftest_navigation_search.py
          python selftest_view_source.py

  ui-regression:
    # 质量门禁（S6）：shared/shell 单源首页的 UI 回归——已知缺陷逐条断言
    # （缺陷库 tests/KNOWN_DEFECTS.md；失败 = 阻断 push/PR）
    name: UI Regression (start.html)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: 安装 Node 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: '22'
      - name: 运行 UI 回归测试
        run: node --test tests/ui-regression/start_page.test.mjs
      - name: 测试报告
        if: always()
        run: echo "UI 回归结果见上方 TAP 输出（pass/fail 计数）；失败即门禁阻断"
