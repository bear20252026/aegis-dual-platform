# Aegis CI —— 双端代码质量检查
# 触发：push 到 master / 任意 pull request
# 检查项：UI 回归（start.html 已知缺陷断言）
# 说明：Android（ktlint/detekt/单测）由 android-quality.yml 门禁、
#       C#（dotnet build/test）由 contracts.yml 门禁——均为全量 PR/push
#       触发，本文件不再重复（全库审计 2026-09-02：删除 android-lint 占位 job——
#       原内容为纯 echo，名为门禁实为摆设）。
# SP-151（2026-09-26 审计）：原 python-quality job（ruff/bandit/mypy/
#       8 个 selftest）跑在 legacy 归档栈且注释误称"活跃新栈"——整体迁出为
#       独立低频归档守护 legacy-python-guard.yml（weekly cron + 手动触发）。
#       取舍：拆独立 workflow 而非本文件加 schedule——定时触发不连带跑
#       ui-regression，常跑 push/PR 门禁从此对准现役栈。

name: CI

on:
  push:
    branches: [master]
    # SP-235（2026-10-02 审计·S-20）：push 补 paths 过滤——触发面按测试输入
    # 圈定（snake.test.js 属 shared/shell/**；PR 触发面保持不过滤）
    paths:
      # R8-SH-10（第八轮审计 2026-10-04）：清单此前只有 4 项，而本 job 的断言语料
      # 实际 readFileSync 9 处、其中 4 处在清单之外（含它亲自守护的 prepare-geogebra
      # action.yml 与它断言过的 csproj/spec/release-android.yml）——「只改了 action.yml」
      # 这类直推 master 不触发唯一守它的 UI 门禁。现按真实输入闭包补齐（PR 触发面
      # 本来不过滤，故影响限于直推路径）。
      - 'tests/ui-regression/**'
      - 'tests/KNOWN_DEFECTS.md'
      - 'shared/shell/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release-android.yml'
      - '.github/actions/prepare-geogebra/action.yml'
      - 'windows/src/Aegis.Windows.App/Aegis.Windows.App.csproj'
      - 'legacy/windows-pywebview/aegis_webview.spec'
  pull_request:
    branches: [master]
  workflow_dispatch: {}          # 手动触发（SP-235：此前缺，改动即跑不可控）

permissions:
  contents: read


# PY-044..051：同分支重复 push/PR 取消旧运行（节省 runner 与排队）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui-regression:
    # 质量门禁（S6）：shared/shell 单源首页的 UI 回归——已知缺陷逐条断言
    # （缺陷库 tests/KNOWN_DEFECTS.md；失败 = 阻断 push/PR）
    name: UI Regression (start.html)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)
      - name: 安装 Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: 运行 UI 回归测试
        # SP-163（2026-09-26 审计）：显式文件清单使新增测试文件静默不跑——
        # 改 node 侧 glob 展开（引号防 shell 抢先展开；node 21+ 原生支持，
        # Windows 本地与 Linux CI 均验证），新文件入目录即入门禁。
        run: node --test "tests/ui-regression/*.test.mjs"
      - name: 运行贪吃蛇回归测试
        # WB-012：snake.test.js 此前不在任何 CI（独立 assert 风格，非 node:test）
        run: node shared/shell/snake.test.js
      # SP-231（2026-10-02 审计·S-14）：原"测试报告"纯 echo 步骤删除——
      # node --test 的 TAP 输出即报告，echo 步骤零信息量（同 ci.yml 2026-09-02
      # 删 android-lint 占位 job 的同型清理）
