# Aegis CI —— 双端代码质量检查
# 触发：push 到 master / 任意 pull request
# 环境：ubuntu-latest（Python 3.14）
# 检查项：validate_release / ruff / bandit / mypy（Windows 源码 + 校验脚本）

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python-checks:
    name: Python 质量检查（ruff / bandit / mypy / validate_release）
    # 必须 windows-latest：Aegis 是 Windows 应用，mypy 检查的 winreg/
    # ctypes.windll 仅在 Windows 有类型桩；Linux 上会误报（P6 教训延伸：
    # CI 平台须与目标/本地环境一致）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/aegis_source
    steps:
      - name: 检出代码
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: 安装 Python 3.14
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.14"

      - name: 安装检查工具
        # 全量安装：requirements.txt（运行依赖，含 PySide6——asset_scheme
        # 的 mypy 检查需要其类型桩）+ requirements-dev.txt（== 锁定版本，
        # P6 教训：CI 与本地口径一致）+ types-pywin32（security.py 桩）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt types-pywin32

      - name: 静态验证（AST / JSON / XML / 版本声明）
        run: python ../../validate_release.py

      - name: ruff 检查（Lint + 格式，0 错误）
        # 口径与本地一致：仅检查活跃新栈，排除 legacy/（Qt 旧栈归档，
        # 61 个 Python 不参与运行面——全量扫描会误报 11 处存量风格问题）
        run: ruff check . --exclude legacy --exclude "windows/aegis_source/**" --ignore RUF001,RUF003,E501,TRY300,TRY003,TRY301,RUF021,E402,I001

      - name: bandit 安全扫描（无 Medium/High）
        # 设计豁免规则（见 KNOWLEDGE_BASE.md「P6 bandit 豁免」）：
        # - B110 try_except_pass：静默降级是安全设计
        # - B404/B603/B607 subprocess：均为参数列表 + shell=False 的受控
        #   调用（security.py icacls / webview2_probe.py tasklist），无注入面
        # 其余规则 Medium/High 触发失败（bandit 退出码即门禁）。
        run: bandit -r app/ -q --skip B110,B404,B603,B607

      - name: mypy 类型检查（新栈 0 错误）
        shell: bash
        run: |
          mypy main_webview.py \
            app/api_bridge.py app/nav_queue.py app/shell_toolbar.py \
            app/config.py app/threat_feed.py app/asset_scheme.py \
            app/paths.py app/bookmark_store.py app/history_store.py \
            app/database.py app/security.py app/backdrop.py \
            crash_reporter.py --exclude "System Volume Information"

  android-lint:
    name: Android 编译与检查（Kotlin 语法级）
    runs-on: ubuntu-latest
    # S-05 整改（国防级审查）：移除 if: false——Android job 设为不可绕过
    # 门禁（android-quality.yml 已覆盖 detekt/ktlint 质量检查；本 job 跑
    # Kotlin 编译——gradlew 已提交）
    steps:
      - name: 检出代码
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: 占位
        run: echo "Android Lint 需 Gradle Wrapper 后启用（当前工程无 wrapper）"
