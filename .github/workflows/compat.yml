# Aegis WebView2 兼容性回归（落地①）
# 背景：WebView2 Runtime 自 v152（2026-08-24）起改为 2 周更新节奏，
#       Evergreen 自动更新可能破坏核心功能。本工作流定时 + 手动触发：
#       1. 在 windows-latest（自带 WebView2）上运行全部自动化回归
#          （validate_release + 3 selftest，经 app.webview2_probe.run_selftests）
#       2. 生成 WebView2 兼容性探测报告（Runtime 版本 + 关键 API 可用性）
#       3. 报告归档至 docs/compat-baselines/（形成版本×功能的回归基线）
#       4. SP-222（2026-10-02 审计）：新增正典 C# 栈兼容 job（build + 双测试
#          套件）——正典栈基线由 windows-canonical-stack 承担，归档栈探测保留
# 触发：每周一 06:00 UTC 定时 + 手动（workflow_dispatch，供新 Runtime 发布后即跑）
name: WebView2-Compat

# 注：on 加引号以避免 YAML 1.1 布尔解析歧义（GitHub Actions 解析器
# 同时支持带引号形式；PyYAML 本地验证也不会误报）
"on":
  schedule:
    - cron: "0 6 * * 1"          # 每周一 06:00 UTC
  workflow_dispatch: {}          # 手动触发（新 Runtime 版本发布后立即验证）

permissions:
  contents: read


# PY-044..051：同分支重复 push/PR 取消旧运行（节省 runner 与排队）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  webview2-regression:
    name: WebView2 兼容性回归（自检 + 探测报告）
    runs-on: windows-2025      # GitHub 官方镜像自带 WebView2 Runtime
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"            # Windows runner 控制台默认 cp1252，probe 中文输出会 UnicodeEncodeError
    defaults:
      run:
        working-directory: legacy/windows-pywebview
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)

      - name: 安装 Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (SP-180 更正注记)
        with:
          # PY-063：与 contracts.yml/legacy-python-guard.yml 统一 3.12
          # SP-181（2026-10-01 审计）：步骤名原书"安装 Python 3.14"与实装
          # 3.12 不符；注释原引 ci.yml（该 workflow 无 Python 步骤）——
          # 一并改为真实对齐对象。
          python-version: "3.12"

      - name: 运行自动化回归（validate_release + 3 selftest）
        # shell: bash —— Windows runner 默认 pwsh，`2>/dev/null` 会被解析为
        # 写入 D:\dev\null 文件（路径不存在直接报错），必须显式用 bash。
        # 2026-09-14/21 两次定时运行 20s 即败即此因。
        # PY-067：stderr 不再全吞——tee 落盘排障。
        # PY-182（2026-09-26 审计）：删除"探测失败回退纯 selftest"路径——
        # 探测失败恰是 WebView2 回归场景，静默回退可使整条定时门禁对真实
        # 回归保持绿色。现在探测失败（GitHub bash 默认 -eo pipefail，经 tee
        # 管道后退出码正确传递）直接 fail。
        shell: bash
        run: |
          python -m app.webview2_probe 2>&1 | tee probe-stderr.log

      - name: 生成 WebView2 兼容性探测报告
        run: |
          python -c "import sys, json; sys.path.insert(0, '.'); from app.webview2_probe import build_probe_report; print(json.dumps(build_probe_report(), ensure_ascii=False, indent=2))" | Out-File -Encoding utf8 ../../docs/compat-baselines/probe-latest.json
          echo "probe 报告已生成"

      - name: 生成按日期快照（PY-068 注释改实：本工作流无回仓写权限——
              快照与基线均不回写仓库，仅随下方 artifact 上传留存）
        run: |
          $stamp = Get-Date -Format "yyyyMMdd"
          Copy-Item ../../docs/compat-baselines/probe-latest.json "../../docs/compat-baselines/probe-$stamp.json" -Force
          echo "快照已生成: probe-$stamp.json（仅 CI artifact，不回仓）"

      - name: 上传报告为 CI 制品（便于下载核对——含 PY-067 stderr 排障日志）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webview2-probe-report
          path: |
            docs/compat-baselines/probe-latest.json
            legacy/windows-pywebview/probe-stderr.log
          if-no-files-found: warn
          # SP-253（2026-10-02 审计·S-30）：probe 报告是 WebView2 兼容性基线
          # 证据（Runtime 版本 × API 可用性）——按基线类给 30 天留存
          retention-days: 30

  # SP-222（2026-10-02 审计·S-01）：上方唯一 job 的全部探测对象是归档栈
  # （legacy/windows-pywebview——ADR-009 只读冻结），正典 C# 栈（windows/，
  # 唯一发布制品）此前零 WebView2 兼容探测。新增本 job 承担正典栈基线：
  # 与归档栈探测 job 同触发（weekly cron + workflow_dispatch），对正典栈跑
  # 与 contracts.yml windows-contract-build 逐字同口径的构建 + 双测试套件
  # 门禁；归档栈探测 job 保留不动。
  windows-canonical-stack:
    name: Windows 正典 C# 栈兼容门禁（build + 双测试套件——正典栈基线）
    runs-on: windows-2025
    timeout-minutes: 40
    # R9-CI-10（第九轮 2026-10-10，PR #137 实证）：Windows runner 的控制台代码页不是
    # UTF-8，门禁脚本打印中文/✅❌ 时抛 UnicodeEncodeError ⇒ 「判定结果由编码决定」。
    # 与本文件 webview2-regression、legacy-python-guard.yml 同口径声明 job 级 UTF-8。
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # R9-CI-9：本 job 的测试步骤要调 scripts/assert_test_counts.py —— 不依赖镜像自带
      # 解释器，与 webview2-regression/contracts.yml 显式钉 3.12 同口径。
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (SP-244 单版本统一)
        with:
          path: ~/.nuget/packages
          # 缓存键与 contracts.yml windows-contract-build 同口径
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/**/*.csproj', 'windows/**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: 正典栈构建门禁（与 contracts.yml windows-contract-build 同口径）
        run: dotnet build windows/src/Aegis.Windows.App/Aegis.Windows.App.csproj --configuration Release -r win-x64 -p:RestoreLockedMode=true
      # R9-CI-9 + 项 13(a)：命令面与发现数下界断言单源在
      # .github/actions/dotnet-test-suite——八处调用点只声明「测哪个工程、落在哪个目录、
      # 下界多少」，参数不再各抄一份（详见该 action 头注的边界说明）。
      - name: 正典栈测试门禁（Core 领域层，发现数下界 R9-CI-9）
        uses: ./.github/actions/dotnet-test-suite
        with:
          project: windows/tests/Aegis.Windows.Core.Tests/Aegis.Windows.Core.Tests.csproj
          results-dir: TestResults/core
          trx-name: core-tests.trx
          label: Core
          minimum: 700
      - name: 正典栈测试门禁（Broker 授权生命周期，发现数下界 R9-CI-9）
        uses: ./.github/actions/dotnet-test-suite
        with:
          project: windows/tests/Aegis.Windows.Broker.Tests/Aegis.Windows.Broker.Tests.csproj
          results-dir: TestResults/broker
          trx-name: broker-tests.trx
          label: Broker
          minimum: 160
