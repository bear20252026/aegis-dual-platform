# release-android.yml —— Android 平台独立交付链（INV-05）
# 独立可追溯：build → sbom → provenance → verify
# 可独立运行（workflow_dispatch）调试友好；release.yml 编排器触发时亦可调用。
#
# ⚠️ 使用前：私有仓库 attestations 需 GitHub Enterprise Cloud

name: Release-Android

on:
  # 编排器（release.yml workflow_call）独占触发——移除 tag 直推双触发面（PY-007）
  workflow_dispatch: {}
  workflow_call:
    # SP-218（2026-10-01 发布链批）：同 release-windows——编排器显式传参要求
    # 本子流声明 secret 面,否则 startup_failure。required:false 保留 dispatch
    # 无凭据调试路径(缺省走未签名 APK 告警分支——v2.1.12 教训)。
    secrets:
      AEGIS_KEYSTORE_FILE:
        required: false
        description: Android 签名 keystore(base64;缺失走未签名告警路径)
      AEGIS_KEYSTORE_PASSWORD:
        required: false
        description: keystore 存储密码
      AEGIS_KEY_ALIAS:
        required: false
        description: 签名 key 别名
      AEGIS_KEY_PASSWORD:
        required: false
        description: 签名 key 密码

permissions:
  contents: read

jobs:
  pin-check:
    runs-on: ubuntu-latest
    # SP-251（2026-10-02 审计·S-28）：pin 检查是纯 grep 秒级步骤——60 分钟
    # 超时为子流模板遗留；三子流统一 5、编排器（release.yml）统一 10
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)
      # SP-182（2026-10-01 审计）：pin 检查收敛为 composite action 单源——
      # 四副本漂移（存在性断言/注释详略不一）消除
      - uses: ./.github/actions/pin-check

  build:
    needs: pin-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      attestations: write
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)
      # SP-196（2026-10-01 审计）：verify_versions / build_metadata /
      # write_checksum_json / native_artifact_manifest 依赖镜像预装 python——
      # 显式固化（PY-065 同型 5 处之一）
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.99.0
          targets: aarch64-linux-android  # 单架构：arm64-v8a（99% 真机）
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (PY-056)
        with:
          workspaces: core/rust-policy-core
      - name: Install JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1 (SP-178 重 pin)
        with:
          distribution: temurin
          java-version: "21"
          # SP-215（2026-10-01 审计）：Gradle 缓存统一为 setup-java cache: gradle
          # 单机制——此前本文件/android-quality 用 actions/cache 自管键、
          # contracts 用 setup-java 内建缓存，两套机制并存漂移。缓存键统一
          # 消费 cache-dependency-path（含 libs.versions.toml——AD-243：版本
          # 目录变更必须失效缓存；SP-184：本文件旧键漏该文件）。
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/**
            android/gradle/libs.versions.toml
      - name: Restore release signing keystore (from secrets)
        env:
          AEGIS_KEYSTORE_FILE_B64: ${{ secrets.AEGIS_KEYSTORE_FILE }}
          # SP-213（2026-10-01 审计）：github.ref_type 直插脚本与同步骤
          # ref_name 的 env 中转口径不一（PY-181 同型）——统一经 env 引用
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -z "$AEGIS_KEYSTORE_FILE_B64" ]; then
            # 审计整改：tag 构建必须带签名 keystore——未签名 APK 不得进入发布
            if [ "$REF_TYPE" = "tag" ]; then
              echo "❌ AEGIS_KEYSTORE_FILE 未配置——tag 发布必须产出已签名 APK（fail-closed）"
              exit 1
            fi
            echo "::warning::AEGIS_KEYSTORE_FILE 未配置——本构建产出未签名 APK（非 tag 调试）"
          else
            echo "$AEGIS_KEYSTORE_FILE_B64" | base64 -d > "$RUNNER_TEMP/aegis-release.jks"
            echo "AEGIS_KEYSTORE_FILE=$RUNNER_TEMP/aegis-release.jks" >> "$GITHUB_ENV"
            echo "✅ 签名 keystore 已就绪"
          fi
      - name: Verify shared version and release tag
        shell: bash
        env:
          # PY-181（2026-09-26 审计）：tag 名是外部可控输入，直接内插 bash
          # 脚本可注入任意命令——env 中转后脚本内仅引用环境变量
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            python ../scripts/verify_versions.py --tag "$REF_NAME"
          else
            python ../scripts/verify_versions.py
          fi
      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4 (SP-178 重 pin)
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.0.12433566"
      # SP-215（2026-10-01 审计）：原"Cache Gradle"步骤（actions/cache 自管键）
      # 已删除——统一走上方 setup-java cache: gradle 单机制（键含
      # libs.versions.toml，见 SP-184 注记）
      - name: Prepare offline GeoGebra pad into APK assets
        uses: ./.github/actions/prepare-geogebra
        with:
          dest-dir: android/app/src/main/assets/geogebra
      # SP-202（2026-10-01 审计）：cargo install 从源码编译数分钟/次——缓存
      # ~/.cargo/bin 二进制（键含版本号，升级自动失效）；命中时跳过安装
      - name: Cache cargo-ndk binary (SP-202)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (SP-178 重 pin)
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-bin-4.1.2-${{ runner.os }}
      - name: Build Android arm64-v8a native policy library
        working-directory: core/rust-policy-core
        run: |
          command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk --version 4.1.2 --locked
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.0.12433566"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export ANDROID_NDK="$ANDROID_NDK_HOME"
          # SP-223（2026-10-02 审计·S-02）：构建缺 RUSTFLAGS 16K 对齐——此前仅
          # native-policy-artifacts.yml 组合冒烟链有（同 ELF 段对齐要求），
          # 发布链漏配。补齐后下方 readelf 对最终产物做 fail-closed 断言。
          # ELF 段 16KB 对齐（ADR-009）：16KB 页设备（Android 15+ 部分
          # 机型）安装时要求 LOAD 段 16K 对齐，否则 INSTALL_FAILED_INVALID_APK
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          test -d "$ANDROID_NDK_HOME"
          cargo ndk --platform 26 \
            -t arm64-v8a \
            -o "$GITHUB_WORKSPACE/dist/native-policy/android" \
            build --release --locked
          # SP-223 配套：LOAD 段对齐断言（readelf 实测产物——max-page-size=
          # 16384 生效时每个 LOAD 段 Align 列为 0x4000；任一段不对齐即 fail）
          SO_FILE="$GITHUB_WORKSPACE/dist/native-policy/android/arm64-v8a/libaegis_policy_core.so"
          # grep -c 计 0 时以退出码 1 终止管道——set -e 下赋值语句静默中断
          #（dispatch 首跑实证，echo 从未到达）；|| true 保住探针可观测
          if [ ! -f "$SO_FILE" ]; then
            echo "❌ 产物缺失：$SO_FILE——dist 现场转储："
            find "$GITHUB_WORKSPACE/dist/native-policy" -type f || true
            exit 1
          fi
          # readelf 默认窄输出把 LOAD 行折成两行（Flags/Align 在续行）——
          # "grep ' LOAD ' | grep -c '0x4000'" 恒为 0（dispatch 首跑实证，
          # 产物实际全对齐而误报）。-lW 宽输出单行化 + bash 十六进制数值比较
          load_total=$(readelf -lW "$SO_FILE" | grep -c ' LOAD ' || true)
          load_aligned=$(readelf -lW "$SO_FILE" | awk '/ LOAD / {print $NF}' |
            while read -r a; do [ $((a)) -ge 16384 ] && echo 1; done | wc -l)
          echo "[readelf] LOAD 段数=$load_total，16K(0x4000) 对齐段数=$load_aligned"
          if [ "$load_total" -eq 0 ] || [ "$load_total" -ne "$load_aligned" ]; then
            readelf -lW "$SO_FILE" | sed -n '/Program Headers/,/Section to Segment/p'
            echo "❌ LOAD 段未全部 16KB 对齐（max-page-size=16384 未生效）"
            exit 1
          fi
      - name: Generate Kotlin binding and native policy manifest
        working-directory: core/rust-policy-core
        run: |
          cargo run --locked --features uniffi-bindgen --bin aegis-uniffi-bindgen -- \
            generate "$GITHUB_WORKSPACE/dist/native-policy/android/arm64-v8a/libaegis_policy_core.so" \
            --language kotlin \
            --out-dir "$GITHUB_WORKSPACE/dist/native-policy/android/kotlin" \
            --no-format
          python "$GITHUB_WORKSPACE/release/native_artifact_manifest.py" \
            --root "$GITHUB_WORKSPACE/dist/native-policy" \
            --output "$GITHUB_WORKSPACE/dist/native-policy-manifest.json" --require android
      - name: Run full Android Broker tests including native JSON decision mapping
        run: bash ./gradlew :broker:testDebugUnitTest --no-daemon
      - name: Verify enabled Android native gate fails closed in JVM unit tests
        run: |
          bash ./gradlew :broker:testDebugUnitTest --no-daemon \
            --tests com.aegis.broker.AndroidBrokerTest.defaultNativePolicyCoreGateClosesWhenBuildRequiresNativeCore \
            -PrequireNativePolicyCore=true \
            -PnativePolicyCoreDir="$GITHUB_WORKSPACE/dist/native-policy/android"
      - name: Build release APK with the native navigation decision core
        env:
          # secrets 只能显式注入——签名凭据四件套透传给 gradle（FILE 已由
          # restore 步骤写入 GITHUB_ENV）
          AEGIS_KEYSTORE_PASSWORD: ${{ secrets.AEGIS_KEYSTORE_PASSWORD }}
          AEGIS_KEY_ALIAS: ${{ secrets.AEGIS_KEY_ALIAS }}
          AEGIS_KEY_PASSWORD: ${{ secrets.AEGIS_KEY_PASSWORD }}
        run: |
          # 审计第六轮（2026-10-03/04）：确认开关恢复启用。
          # 2026-08-30 关闭它的根因在核心侧：request_navigation_confirmation 把
          # 「每一个」可放行导航都转成 RequireConfirmation——等价于每次导航都弹确认，
          # 不可用。本轮在 Rust FFI 通路落定高危判据（本机/私网：127/8、0/8、10/8、
          # 172.16/12、192.168/16、169.254/16 与 localhost），普通公网导航直接
          # Allow，确认面板自此只对少数目标触发。
          # 原注释「Broker allow/deny 策略仍在，仅免确认弹窗」在当时并不成立：
          # 自动批准路径由不受信的内容导航回调自行兑换一次性 nonce，整套确认域
          # （pendingConfirmation / 防孤儿 nonce / 受信 Compose 批准入口）为死代码。
          # 该面板自本次起才是活代码——发布前须按 device-validation.md 真机验证。
          bash ./gradlew :app:assembleRelease --no-daemon \
            -PrequireNativePolicyCore=true \
            -PrequireNavigationConfirmation=true \
            -PnativePolicyCoreDir="$GITHUB_WORKSPACE/dist/native-policy/android"
          # zipalign 校验（ADR-009）：4K + 16K 页对齐双验证，不对齐即失败
          BT=$(ls -d "$ANDROID_HOME/build-tools/"*/ | sort -V | tail -1)
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk)
          "$BT/zipalign" -c -P 16 4 "$APK_FILE" && echo "[zipalign] 16K 对齐 OK"
          apk_entries="$(unzip -Z1 app/build/outputs/apk/release/*.apk)"
          # 单架构分发规则（用户决策 2026-08-30 永久生效，ADR-008）：
          # lib/ 白名单 = arm64-v8a——正向断言必须存在，反向断言禁止
          # armeabi-v7a（32 位老架构）与 x86/x86_64（模拟器）入包，
          # 任一违反即构建失败（防止体积无端膨胀的规则性防线）
          grep -Fx "lib/arm64-v8a/libaegis_policy_core.so" <<< "$apk_entries"
          if grep -Eq "^lib/(armeabi-v7a|x86|x86_64)/" <<< "$apk_entries"; then
            echo "FAIL: 发现非 arm64-v8a ABI 入包（违反单架构分发规则）"
            exit 1
          fi
          # I-08（2026-10-02 审计）：离线画板资产随包断言——prepare-geogebra
          # 失败/路径改形时禁止静默缺画板出厂（与 release-windows.yml 对齐）
          grep -Fx "assets/geogebra/GeoGebra/HTML5/5.0/GeoGebra.html" <<< "$apk_entries"
      - name: Verify APK signature (fail-closed on tag)
        shell: bash
        env:
          # SP-213（2026-10-01 审计）：ref_type 经 env 中转（与 ref_name 同口径）
          REF_TYPE: ${{ github.ref_type }}
        run: |
          BT=$(ls -d "$ANDROID_HOME/build-tools/"*/ | sort -V | tail -1)
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk)
          if "$BT/apksigner" verify --print-certs "$APK_FILE" > /tmp/apksigner.out 2>&1; then
            echo "[apksigner] 签名验证 OK"; cat /tmp/apksigner.out
          elif [ "$REF_TYPE" = "tag" ]; then
            echo "❌ APK 未签名或签名损坏——tag 发布必须已签名（fail-closed）"
            exit 1
          else
            echo "::warning::APK 未签名或签名校验未通过（非 tag 调试构建）"
          fi
      - name: Assert signing certificate identity (pin)
        # 审计第六轮（2026-10-03）：上一步只证明「有签名且成链」，未证明
        # 「是谁签的」。AEGIS_KEYSTORE_* 四件套被替换（管理员误改/secret 供
        # 应链/账号被钓）时，CI 会用攻击者的钥匙签名，随后 apksigner 通过、
        # SBOM 生成、attestation 签发、SHA256SUMS 齐备、全绿发布——一条恶意
        # 更新链完整穿过流水线。现把制品实签指纹与受版本控制、经评审的身份
        # 文件对账。放仓库文件而非 secret：能替换 keystore secret 的人同样能
        # 替换 expected secret（同一爆炸半径），文件则另需 git 写权限并过评审，
        # 且 v* tag ruleset 已使发布 tag 不可改写。
        shell: bash
        run: |
          IDENTITY=../docs/release/signing-identity.txt
          if [ ! -f "$IDENTITY" ]; then
            echo "❌ 签名身份文件缺失：$IDENTITY——无法对账（fail-closed）"
            exit 1
          fi
          EXPECTED=$(sed -n 's/^APK_CERT_SHA256=//p' "$IDENTITY" | head -1 | tr -d '\r' | tr 'A-Z' 'a-z')
          if [ -z "$EXPECTED" ]; then
            echo "❌ $IDENTITY 未登记 APK_CERT_SHA256——无法对账（fail-closed）"
            exit 1
          fi
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: *//p' /tmp/apksigner.out | head -1 | tr -d '\r' | tr 'A-Z' 'a-z')
          if [ -z "$ACTUAL" ]; then
            echo "❌ 无法从 apksigner 输出提取证书指纹（签名验证步骤未产出结果）"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ 签名身份不匹配：APK 实签 $ACTUAL ≠ 预期 $EXPECTED"
            echo "   可能为密钥替换/供应链事件——停止发布（fail-closed）"
            exit 1
          fi
          echo "[pin] 签名身份对账通过：$ACTUAL"
      - name: Collect APK + generate SHA-256
        shell: bash
        run: |
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk)
          VERSION=$(sed -n 's/^VERSION_NAME=//p' ../shared/version.properties)
          APK_NAME="Aegis-${VERSION}-android-arm64.apk"
          cp "$APK_FILE" "../dist/$APK_NAME"
          # 方案 A（用户实测定案 2026-08-31，永久流程）：
          # 分发一律用 zip——QQ 接收 .apk 强制加 .1 后缀致 MIUI 不识别为安装包，
          # zip 无此问题。发布物 = APK + APK 同名 zip，两者都进 SHA256SUMS。
          (cd ../dist && zip -9 "Aegis-${VERSION}-android-arm64.zip" "$APK_NAME")
          python ../release/build_metadata.py --platform android --output ../dist/build-metadata.json
          python ../release/write_checksum_json.py --root ../dist --output ../dist/SHA256SUMS.json
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/**
      - name: Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: dist/
          if-no-files-found: error

  sbom:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)
      # SP-196（2026-10-01 审计）：write_checksum_json 依赖镜像预装 python
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (SP-178 重 pin)
        with:
          name: release-android
          path: dist
      - name: Generate CycloneDX SBOM (gradle deps)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3 (R8-DEPS-15 重 pin)
        with:
          path: android
          format: cyclonedx-json
          output-file: sbom-android.cdx.json
      # PY-180（2026-09-26 审计）：SBOM 复制进 dist 后重传 build artifact（见
      # 下方 overwrite 重传），使其随 Release 发布；并重生成 SHA256SUMS 纳入
      # SBOM（否则 verify_checksum_json 对"未覆盖文件"fail-closed 失败）。
      - name: Copy SBOM into dist + regenerate SHA256SUMS (PY-180)
        run: |
          set -e
          cp sbom-android.cdx.json dist/sbom-android.cdx.json
          python release/write_checksum_json.py --root dist --output dist/SHA256SUMS.json
      - name: Attest SBOM (bind every artifact)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0 (SP-178 重 pin)
        with:
          subject-path: dist/**
          sbom-path: sbom-android.cdx.json
      # PY-180/PY-179 配套（2026-09-26 审计）：SHA256SUMS.json 重生成后摘要
      # 已变、SBOM 文件为新增——对最终 dist 重新 attest SLSA provenance，
      # 使 verify 段逐工件 attestation 校验对现摘要成立（同 run signer 一致）
      - name: Re-attest build provenance for final dist (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/**
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-android
          path: sbom-android.cdx.json
      - name: Upload Android artifacts (PY-180：重传含 SBOM 的 dist)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: dist/
          if-no-files-found: error
          # PY-180：同名 artifact 覆盖重传（v4 支持）——publish 与 verify-gate
          # 下载到的 release-android 由此包含 SBOM 与重生成后的清单
          overwrite: true

  verify:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)
      # SP-196（2026-10-01 审计）：verify_checksum_json 依赖镜像预装 python
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (SP-178 重 pin)
        with:
          name: release-android
          path: dist
      # PY-176/SP-143（2026-09-26 审计）：补 --signer-workflow 固定 signer；
      # SP-153（2026-09-26 审计）：与编排器收敛为同一 composite action（并行度
      # 统一 -P 8）。signer 固定为"本子流 workflow 文件@本次 run ref"
      - name: Verify attestations (SLSA + SBOM)
        uses: ./.github/actions/verify-release-attestations
        with:
          dist-path: dist
          signer-workflow: ${{ github.repository }}/.github/workflows/release-android.yml@${{ github.ref }}
      - name: Checksum reconciliation
        run: python release/verify_checksum_json.py --root dist --manifest dist/SHA256SUMS.json
      - name: Fail-closed gate
        run: echo "✅ Android 平台验证通过"
