# release-android.yml —— Android 平台独立交付链（INV-05）
# 独立可追溯：build → sbom → provenance → verify
# 可独立运行（workflow_dispatch）调试友好；release.yml 编排器触发时亦可调用。
#
# ⚠️ 使用前：私有仓库 attestations 需 GitHub Enterprise Cloud

name: Release-Android

on:
  # 编排器（release.yml workflow_call）独占触发——移除 tag 直推双触发面（PY-007）
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  pin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Pin check (fail-closed)
        run: |
          # PY-177/SP-152（2026-09-26 审计）：pin 检查改白名单式并纳入
          # .github/actions/**/action.yml 扫描面（详见 release.yml 同名步骤）
          if grep -rnE '(^|[[:space:]])uses: [^#@]*@' .github/workflows/ .github/actions/ \
              | grep -vE '@[0-9a-fA-F]{40}([[:space:]]|$|#)'; then
            echo "❌ 存在未固定完整 40 位十六进制 SHA 的 action 引用" && exit 1
          fi
          echo "✅ 全部 action 固定完整 SHA"

  build:
    needs: pin-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      attestations: write
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          targets: aarch64-linux-android  # 单架构：arm64-v8a（99% 真机）
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (PY-056)
        with:
          workspaces: core/rust-policy-core
      - name: Install JDK 21
        uses: actions/setup-java@97c5a5e13aa773f277f72c1287dda3c789f1366c
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore release signing keystore (from secrets)
        env:
          AEGIS_KEYSTORE_FILE_B64: ${{ secrets.AEGIS_KEYSTORE_FILE }}
        run: |
          if [ -z "$AEGIS_KEYSTORE_FILE_B64" ]; then
            # 审计整改：tag 构建必须带签名 keystore——未签名 APK 不得进入发布
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "❌ AEGIS_KEYSTORE_FILE 未配置——tag 发布必须产出已签名 APK（fail-closed）"
              exit 1
            fi
            echo "::warning::AEGIS_KEYSTORE_FILE 未配置——本构建产出未签名 APK（非 tag 调试）"
          else
            echo "$AEGIS_KEYSTORE_FILE_B64" | base64 -d > "$RUNNER_TEMP/aegis-release.jks"
            echo "AEGIS_KEYSTORE_FILE=$RUNNER_TEMP/aegis-release.jks" >> "$GITHUB_ENV"
            echo "✅ 签名 keystore 已就绪"
          fi
      - name: Verify shared version and release tag
        shell: bash
        env:
          # PY-181（2026-09-26 审计）：tag 名是外部可控输入，直接内插 bash
          # 脚本可注入任意命令——env 中转后脚本内仅引用环境变量
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            python ../scripts/verify_versions.py --tag "$REF_NAME"
          else
            python ../scripts/verify_versions.py
          fi
      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.0.12433566"
      - name: Cache Gradle
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/**') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Prepare offline GeoGebra pad into APK assets
        uses: ./.github/actions/prepare-geogebra
        with:
          dest-dir: android/app/src/main/assets/geogebra
      - name: Build Android arm64-v8a native policy library
        working-directory: core/rust-policy-core
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.0.12433566"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export ANDROID_NDK="$ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME"
          cargo ndk --platform 26 \
            -t arm64-v8a \
            -o "$GITHUB_WORKSPACE/dist/native-policy/android" \
            build --release --locked
      - name: Generate Kotlin binding and native policy manifest
        working-directory: core/rust-policy-core
        run: |
          cargo run --locked --features uniffi-bindgen --bin aegis-uniffi-bindgen -- \
            generate "$GITHUB_WORKSPACE/dist/native-policy/android/arm64-v8a/libaegis_policy_core.so" \
            --language kotlin \
            --out-dir "$GITHUB_WORKSPACE/dist/native-policy/android/kotlin" \
            --no-format
          python "$GITHUB_WORKSPACE/release/native_artifact_manifest.py" \
            --root "$GITHUB_WORKSPACE/dist/native-policy" \
            --output "$GITHUB_WORKSPACE/dist/native-policy-manifest.json" --require android
      - name: Run full Android Broker tests including native JSON decision mapping
        run: bash ./gradlew :broker:testDebugUnitTest --no-daemon
      - name: Verify enabled Android native gate fails closed in JVM unit tests
        run: |
          bash ./gradlew :broker:testDebugUnitTest --no-daemon \
            --tests com.aegis.broker.AndroidBrokerTest.defaultNativePolicyCoreGateClosesWhenBuildRequiresNativeCore \
            -PrequireNativePolicyCore=true \
            -PnativePolicyCoreDir="$GITHUB_WORKSPACE/dist/native-policy/android"
      - name: Build release APK with the native navigation decision core
        env:
          # secrets 只能显式注入——签名凭据四件套透传给 gradle（FILE 已由
          # restore 步骤写入 GITHUB_ENV）
          AEGIS_KEYSTORE_PASSWORD: ${{ secrets.AEGIS_KEYSTORE_PASSWORD }}
          AEGIS_KEY_ALIAS: ${{ secrets.AEGIS_KEY_ALIAS }}
          AEGIS_KEY_PASSWORD: ${{ secrets.AEGIS_KEY_PASSWORD }}
        run: |
          # requireNavigationConfirmation 关闭（用户决策 2026-08-30）：
          # 每次导航弹确认不可用——Broker allow/deny 策略仍在，仅免确认弹窗
          bash ./gradlew :app:assembleRelease --no-daemon \
            -PrequireNativePolicyCore=true \
            -PnativePolicyCoreDir="$GITHUB_WORKSPACE/dist/native-policy/android"
          # zipalign 校验（ADR-009）：4K + 16K 页对齐双验证，不对齐即失败
          BT=$(ls -d "$ANDROID_HOME/build-tools/"*/ | sort -V | tail -1)
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk)
          "$BT/zipalign" -c -P 16 4 "$APK_FILE" && echo "[zipalign] 16K 对齐 OK"
          apk_entries="$(unzip -Z1 app/build/outputs/apk/release/*.apk)"
          # 单架构分发规则（用户决策 2026-08-30 永久生效，ADR-008）：
          # lib/ 白名单 = arm64-v8a——正向断言必须存在，反向断言禁止
          # armeabi-v7a（32 位老架构）与 x86/x86_64（模拟器）入包，
          # 任一违反即构建失败（防止体积无端膨胀的规则性防线）
          grep -Fx "lib/arm64-v8a/libaegis_policy_core.so" <<< "$apk_entries"
          if grep -Eq "^lib/(armeabi-v7a|x86|x86_64)/" <<< "$apk_entries"; then
            echo "FAIL: 发现非 arm64-v8a ABI 入包（违反单架构分发规则）"
            exit 1
          fi
      - name: Verify APK signature (fail-closed on tag)
        shell: bash
        run: |
          BT=$(ls -d "$ANDROID_HOME/build-tools/"*/ | sort -V | tail -1)
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk)
          if "$BT/apksigner" verify --print-certs "$APK_FILE" > /tmp/apksigner.out 2>&1; then
            echo "[apksigner] 签名验证 OK"; cat /tmp/apksigner.out
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "❌ APK 未签名或签名损坏——tag 发布必须已签名（fail-closed）"
            exit 1
          else
            echo "::warning::APK 未签名或签名校验未通过（非 tag 调试构建）"
          fi
      - name: Collect APK + generate SHA-256
        shell: bash
        run: |
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk)
          VERSION=$(sed -n 's/^VERSION_NAME=//p' ../shared/version.properties)
          APK_NAME="Aegis-${VERSION}-android-arm64.apk"
          cp "$APK_FILE" "../dist/$APK_NAME"
          # 方案 A（用户实测定案 2026-08-31，永久流程）：
          # 分发一律用 zip——QQ 接收 .apk 强制加 .1 后缀致 MIUI 不识别为安装包，
          # zip 无此问题。发布物 = APK + APK 同名 zip，两者都进 SHA256SUMS。
          (cd ../dist && zip -9 "Aegis-${VERSION}-android-arm64.zip" "$APK_NAME")
          python ../release/build_metadata.py --platform android --output ../dist/build-metadata.json
          python ../release/write_checksum_json.py --root ../dist --output ../dist/SHA256SUMS.json
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/**
      - name: Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-android
          path: dist/
          if-no-files-found: error

  sbom:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-android
          path: dist
      - name: Generate CycloneDX SBOM (gradle deps)
        uses: anchore/sbom-action@6b31fa7e2d592e47d95d2a5e0520a7352d47ead5
        with:
          path: android
          format: cyclonedx-json
          output-file: sbom-android.cdx.json
      # PY-180（2026-09-26 审计）：SBOM 复制进 dist 后重传 build artifact（见
      # 下方 overwrite 重传），使其随 Release 发布；并重生成 SHA256SUMS 纳入
      # SBOM（否则 verify_checksum_json 对"未覆盖文件"fail-closed 失败）。
      - name: Copy SBOM into dist + regenerate SHA256SUMS (PY-180)
        run: |
          set -e
          cp sbom-android.cdx.json dist/sbom-android.cdx.json
          python release/write_checksum_json.py --root dist --output dist/SHA256SUMS.json
      - name: Attest SBOM (bind every artifact)
        uses: actions/attest-sbom@4c8abdcbea4a6b66f70fd1169e70af4bf5b13701
        with:
          subject-path: dist/**
          sbom-path: sbom-android.cdx.json
      # PY-180/PY-179 配套（2026-09-26 审计）：SHA256SUMS.json 重生成后摘要
      # 已变、SBOM 文件为新增——对最终 dist 重新 attest SLSA provenance，
      # 使 verify 段逐工件 attestation 校验对现摘要成立（同 run signer 一致）
      - name: Re-attest build provenance for final dist (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/**
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-android
          path: sbom-android.cdx.json
      - name: Upload Android artifacts (PY-180：重传含 SBOM 的 dist)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-android
          path: dist/
          if-no-files-found: error
          # PY-180：同名 artifact 覆盖重传（v4 支持）——publish 与 verify-gate
          # 下载到的 release-android 由此包含 SBOM 与重生成后的清单
          overwrite: true

  verify:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-android
          path: dist
      # PY-176/SP-143（2026-09-26 审计）：补 --signer-workflow 固定 signer；
      # SP-153（2026-09-26 审计）：与编排器收敛为同一 composite action（并行度
      # 统一 -P 8）。signer 固定为"本子流 workflow 文件@本次 run ref"
      - name: Verify attestations (SLSA + SBOM)
        uses: ./.github/actions/verify-release-attestations
        with:
          dist-path: dist
          signer-workflow: ${{ github.repository }}/.github/workflows/release-android.yml@${{ github.ref }}
      - name: Checksum reconciliation
        run: python release/verify_checksum_json.py --root dist --manifest dist/SHA256SUMS.json
      - name: Fail-closed gate
        run: echo "✅ Android 平台验证通过"
