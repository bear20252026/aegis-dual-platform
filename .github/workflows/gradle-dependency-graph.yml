# Gradle 依赖图提交（SP-246 收尾——2026-10-03 剩余项批）
# 背景：supply-chain 的三生态漏扫此前只覆盖 pip（pip-audit）/cargo（cargo-audit）/
# NuGet（dotnet list --vulnerable）——Android Gradle 侧零漏扫（supply-chain.yml
# 内 TODO(gradle-漏扫) 登记待接，"四生态只扫三"不得成为终态）。
# 方案：gradle/actions/dependency-submission 把 Gradle 解析出的依赖闭包提交到
# GitHub 依赖图——此后 Dependabot alerts / dependency review 对 Android 依赖
# 生效（GitHub 原生漏扫通道，与 supply-chain 的 fail-closed 漏扫互补：
# alerts 是持续告警面，supply-chain 是合入门禁面）。
# 权限：dependency submission API 要求 contents: write——单 workflow 收口，
# 不放大 supply-chain 的最小权限面。
name: Gradle-Dependency-Graph

"on":
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/gradle-dependency-graph.yml'
  schedule:
    # 周一 03:30 UTC（与 compat 03:00/supply-chain 04:00 错峰）——仓库静默期
    # 依赖图按周刷新，新披露 CVE 进入 alerts 视野
    - cron: "30 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

# PY-044..051 口径：同分支重复运行取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit-dependency-graph:
    name: 提交 Gradle 依赖图（Android 依赖漏扫面——SP-246 收尾）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)

      # AGP 9.4.1 要求 ≥17；配置解析即需 JDK（依赖图来自 gradle 依赖解析）
      - name: 安装 JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.0.1 (SP-178 重 pin)
        with:
          distribution: temurin
          java-version: "21"

      - name: 提交依赖图（generate-and-submit——失败即红，fail-closed）
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: android
          dependency-graph: generate-and-submit


  # R9-B47（第九轮 2026-10-13，队列 Q56 = R9-CI-14）：给这条只在 master push / 周检 /
  # 手动触发的提交面加一条**能红**的判据。
  # 为什么不是登记建议的「比对最近一次提交的时间戳」：那要另一条常跑流水线去读运行历史，而那条
  # 流水线本身又需要有人判它没跑——同一个洞换一层皮。内容对账直接得多：GitHub 依赖图必须包含
  # 当前 `android/*/gradle.lockfile` 里的每一个 `group:name` 坐标；锁刚改而图里没有它，
  # 只可能是「作业没跑成」或「跑了但没落图」，两种都要红。周检触发本身就是那只钟。
  # 落图是最终一致的 ⇒ --attempts 复判到上限才红（把「慢」读成「坏」会教会人忽略红灯）。
  # Dependabot 的 Gradle 漏扫面就建立在这张图上：它静默坏掉时全仓没有一张牌会变红（#165 那次
  # 跨 major bump 是靠「先跑一次证明它」人工确认的，不是一次性动作换成常驻判据）。
  verify-graph-freshness:
    name: 依赖图与版本锁对账（R9-B47——提交面静默坏掉必须变红）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: submit-dependency-graph
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 现读依赖图并与 android/*/gradle.lockfile 对账
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify_gradle_graph_freshness.py --attempts 4 --delay 20
