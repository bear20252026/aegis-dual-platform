# 依赖重锁执行面（第八轮 B7 前置——用户 2026-10-07 定稿「重锁在哪做」）
#
# 为什么要有这个 workflow：B7 那批升级（WebView2 SDK 落后约 22 个月、
# Microsoft.Data.Sqlite 10.0.0→10.0.12、`SQLitePCLRaw.bundle_e_sqlite3` 在锁内仍是
# 被点名的 2.1.11（NU1903/GHSA-2m69-gcr7-jv3q 只修了 3/4）、mypy 2.4.0 整链、
# Test.Sdk 跨 major）**全部卡在同一个问题上：锁由谁、在哪重算**。让它在 CI 里
# 可复现、可审计，比每次由本地手工改锁稳——本地 `dotnet restore -r win-x64` 会把
# `net10.0-windows7.0/win-x64` 整块删掉（只删不增，diff 看着像空白改动），
# 那次事故就差点进了主干。因此本 workflow 的重锁步骤后面**必须**跟
# `scripts/verify_lock_rids.py`，且它判红即终止。
#
# 三条硬边界（不是风格，是防呆）：
# ① 只允许 `workflow_dispatch` 触发——不挂 push/PR/schedule，也不进必需检查
#    （依赖图类 job 一旦成为必需项，不匹配路径的 PR 会永久停在 waiting）；
# ② 目标分支必须落在**声明过的那一类前缀**里，脚本层再兜一次：不匹配就终止——
#    本 job 持 `contents: write`，写回目标是它唯一能造成的越界面。两类（R9-B58 / 台账 Q60）：
#    `kind=deps` ⇒ 只写 `deps/*`（人工/常规重锁）；`kind=dependabot` ⇒ 只写 `dependabot/*`
#    （给 Dependabot 的 Gradle bump PR 补依赖证据：它自己生成不了 sha256 校验和，
#    而 STRICT 校验和启用来路就是「缺条目 ⇒ 所有 gradle 作业红 ⇒ 没人能重锁」那个鸡生蛋）。
#    规则单源在 `scripts/relock_branch_guard.sh`（含「face=dotnet 没有 dependabot 面」这条），
#    六个调用点只传参；行为用例在 `tests/python/relock_branch_guard_test.py`。
# ③ 永不写 master：推分支后由人来开 PR 审 diff（`--require-hashes` 能装上才算成功）。
name: Dependency-Retlock

"on":
  workflow_dispatch:
    inputs:
      branch:
        description: "写回目标分支（前缀由 target_kind 决定：deps/ 或 dependabot/；本 workflow 永不写 master）"
        required: true
        default: "deps/relock-round8"
      ecosystem:
        description: "重算面"
        required: false
        type: choice
        options: ["all", "dotnet", "python", "gradle"]
        default: "all"
      target_kind:
        description: "写回目标属于哪一类（deps=人工重锁；dependabot=给 bump PR 补依赖证据，只有 Gradle 面）"
        required: false
        type: choice
        options: ["deps", "dependabot"]
        default: "deps"

permissions:
  contents: write

concurrency:
  group: dependency-relock-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  relock:
    name: 重算并写回依赖锁（RID 块回读门禁把关）
    runs-on: windows-2025
    timeout-minutes: 45
    # gradle 面在下面的 gradle-relock job（ubuntu + AGP 所需 SDK/工具链与本 job 不同口径）。
    # 本 job 只跳过自己——两个 job 各自都带写回面守卫，不依赖对方存在。
    if: ${{ github.event.inputs.ecosystem != 'gradle' && github.event.inputs.target_kind == 'deps' }}
    # Windows runner 上 Python 的 stdout 被重定向到日志管道时按 ANSI 代码页（实测
    # cp1252）编码——本 job 的 heredoc 与 verify_lock_rids.py 都带中文与 ✅❌，
    # 2026-10-08 首次 dispatch 就死在 `print("头注块已保留（…）")` 抛
    # UnicodeEncodeError（run 37793334416），而且报在文件写好**之后**——看着像随机失败。
    # job 级统一 UTF-8；判定面见 tests/python/relock_sop_test.py。
    env:
      PYTHONIOENCODING: utf-8
    steps:
      # R9-CI-2：dispatch 输入一律经 env 中转，`run:` 文本里不再出现 `${{ }}`。
      # `${{ }}` 在 shell 解析**之前**做文本替换，`branch=x"; git push origin HEAD:master; #`
      # 会把下面这道写回面守卫自身打断——本 workflow 是全仓唯一持 `contents: write` 的
      # 手工触发面，「永不写 master」此前只是脚本约定。判据见
      # tests/python/workflow_exit_code_test.py（relock 的 run 块内零 in-run 表达式 +
      # 写回步骤自带二次守卫）。**新增 job 同样适用**：守卫写在每个 job 里，
      # 不靠「另一个 job 也会检查」。
      # 守卫必须排在**检出之后**：R9-B58 起它是一份仓库脚本，而 runner 的 workspace 在第一次
      # `actions/checkout` 之前是空的——放在检出前面就是「调用一个还不存在的文件」。这条不是推理：
      # dispatch 实测红在 `bash: scripts/relock_branch_guard.sh: No such file or directory`
      # （run 38520687580），而当时的判据只数「调用点存在」，抓不到顺序。现在顺序由
      # `tests/python/relock_branch_guard_test.py::test_every_guard_call_sits_after_a_checkout` 判住。
      - name: 检出目标分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: 校验目标分支（写回面守卫；规则单源 scripts/relock_branch_guard.sh）
        shell: bash
        env:
          RELOCK_BRANCH: ${{ github.event.inputs.branch }}
          GUARD_KIND: ${{ github.event.inputs.target_kind }}
        run: |
          set -euo pipefail
          # face 写死在这里而不是取自输入：「谁来写回」是代码事实，调用方选不动。
          bash scripts/relock_branch_guard.sh dotnet "$GUARD_KIND" "$RELOCK_BRANCH"

      - name: 设置 .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: .NET 重锁（RestoreLockedMode=false，三处工程一致）
        shell: bash
        # 只删不增的 RID 块事故就发生在这一步之后——所以下一步是回读门禁，不是构建
        env:
          RELOCK_ECOSYSTEM: ${{ github.event.inputs.ecosystem }}
        run: |
          set -euo pipefail
          if [ "$RELOCK_ECOSYSTEM" = "python" ]; then
            echo "跳过（ecosystem=python）"; exit 0
          fi
          dotnet restore windows/src/Aegis.Windows.App/Aegis.Windows.App.csproj -r win-x64 -p:RestoreLockedMode=false
          dotnet restore windows/tests/Aegis.Windows.Core.Tests/Aegis.Windows.Core.Tests.csproj -r win-x64 -p:RestoreLockedMode=false
          dotnet restore windows/tests/Aegis.Windows.Broker.Tests/Aegis.Windows.Broker.Tests.csproj -r win-x64 -p:RestoreLockedMode=false

      - name: 安装 Python 工具链（重锁输入用）
        if: ${{ github.event.inputs.ecosystem != 'dotnet' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Python 重锁（pip-compile，头注块原样保留）
        if: ${{ github.event.inputs.ecosystem != 'dotnet' }}
        shell: bash
        # requirements-ci.in 头注记载的 SOP：复用既有 pin 做增量（最小 diff）、
        # --generate-hashes、--no-header。--no-header 会抹掉本仓手写的头注块
        #（PY-178/221/258 的判据都在里面），故重算后把原头注块拼回文件顶部——
        # 这一步以前是「人工补回」，是漏补即静默丢文档的活面。
        # 「增量」靠的是 pip-compile 的机制本身：它从 **--output-file 指向的既有文件**
        # 读回现有 pin。所以必须先 `cp requirements-ci.txt .relock-staging.txt`、再把
        # output-file 指向那个 staging 副本。本步骤初版把输出写到全新的
        # .relock-body.txt（且 cp 出来的 staging 无人使用）——pip-compile 看不到任何
        # 既有 pin，于是整棵传递依赖树按「当前最新」重解：一次 mypy/ruff 的两行 bump
        # 会连带换掉 cyclonedx 系等一片无关包，正是 .in 注释里 #27/#35/#39 三连坏 PR
        # 的形态。锚点在 tests/python/relock_sop_test.py（判「输出面==staging 面」）。
        run: |
          set -euo pipefail
          python -m venv .relock-venv
          if [ -d .relock-venv/Scripts ]; then VENVBIN=.relock-venv/Scripts; else VENVBIN=.relock-venv/bin; fi
          "$VENVBIN/pip" install --quiet pip-tools==7.4.1
          cp requirements-ci.txt .relock-staging.txt
          "$VENVBIN/pip-compile" --quiet --generate-hashes --no-header \
            --output-file .relock-staging.txt requirements-ci.in
          python - <<'PY'
          from pathlib import Path
          path = Path("requirements-ci.txt")
          # 按字节行读（open(newline="")）：`Path.read_text(newline=)` 是 3.13+ 才有的
          # 关键字，CI 钉 3.12——PR #82 就为同一写法红过一次（run 37800016632 是第二次，
          # 差别只在它藏在 workflow 的内嵌 python 里、门禁扫不到，见 py312-compat 补面）。
          with path.open(encoding="utf-8", newline="") as handle:
              raw = handle.read()
          header = []
          for line in (ln.rstrip("\r") for ln in raw.split("\n")):
              if line.startswith("#"):
                  header.append(line)
              else:
                  break
          with Path(".relock-staging.txt").open(encoding="utf-8", newline="") as handle:
              body = handle.read()
          body_lines = [ln.rstrip("\r") for ln in body.split("\n")]
          if not header:
              raise SystemExit("❌ 原锁没有头注块——先确认 requirements-ci.txt 形态")
          rebuilt = "\n".join(header + body_lines)
          path.write_text(rebuilt, encoding="utf-8", newline="")
          # 回写后逐行核对头注仍在：丢了就是文档假账，绝不允许「看着成功」。
          with path.open(encoding="utf-8", newline="") as handle:
              written = handle.read().split("\n")
          missing = [line for line in header if line not in written]
          if missing:
              raise SystemExit(f"❌ 头注回写缺 {len(missing)} 行，首条：{missing[0][:60]}")
          print(f"头注块已保留（{len(header)} 行）")
          PY

      - name: 回读门禁：锁必须仍然完整（RID 块 + 出货依赖 + hash 覆盖）
        shell: bash
        env:
          RELOCK_ECOSYSTEM: ${{ github.event.inputs.ecosystem }}
        run: |
          set -euo pipefail
          python scripts/verify_lock_rids.py
          python scripts/check_package_floors.py
          if [ "$RELOCK_ECOSYSTEM" != "dotnet" ]; then
            python validate_release.py            # 内含锁结构门禁：逐条 == 钉版必带 --hash=、.in↔.txt 对账
            python -m pip install --quiet --require-hashes -r requirements-ci.txt
          fi

      - name: 写回分支（无改动即空跑成功）
        shell: bash
        env:
          RELOCK_BRANCH: ${{ github.event.inputs.branch }}
          RELOCK_RUN_ID: ${{ github.run_id }}
          GUARD_KIND: ${{ github.event.inputs.target_kind }}
        run: |
          # 二次守卫（R9-CI-2）：不依赖第一步的存在——同一份规则再跑一遍
          bash scripts/relock_branch_guard.sh dotnet "$GUARD_KIND" "$RELOCK_BRANCH"

          set -euo pipefail
          git config user.name  "aegis-relock-bot"
          git config user.email "relock@localhost"
          # 逐路径 add，且 pathspec 必须真实存在。初版这里是一行
          #   git add -A windows packages.lock.json requirements-ci.txt requirements-ci.in || true
          # 而仓库根**没有** packages.lock.json（三把锁在 windows/**/ 下）——git 对不存在
          # 的 pathspec 直接 fatal 并放弃整条命令，`|| true` 又把退出码吞掉，于是
          # 重算好的锁一条都没进 index、`git diff --cached --quiet` 恒真，job 打印
          # 「✅ 重锁无差异」正常收工（run 37796042636 实测）。本 job 唯一能造成的
          # 副作用就是写回分支，写不回等于整个执行面是空的。
          for pathspec in windows requirements-ci.txt requirements-ci.in; do
            if [ ! -e "$pathspec" ]; then
              echo "❌ pathspec 不存在：$pathspec——布局变了就改这里，不要静默跳过"
              exit 1
            fi
            git add -A -- "$pathspec"
          done
          if git diff --cached --quiet; then
            echo "✅ 重锁无差异——当前锁已是最新解析结果（这本身就是个结论，不是失败）"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "chore(deps): 重算依赖锁（Dependency-Retlock dispatch，run $RELOCK_RUN_ID）" -q
          git push origin "HEAD:$RELOCK_BRANCH"
          echo "⚠️ 锁已写入 $RELOCK_BRANCH——请开 PR 人工审 diff 后再合并；"
          echo "   审点：win-x64 RID 块仍在、每行 == 钉版带 --hash=、被删条目是否本就该删。"

  # ── Gradle 面（android/ 四模块，项 10 / AEG-011，2026-10-11 启用 STRICT 锁定）─────
  # 为什么是独立 job 而不是在上面的 dotnet 重锁 job 里加几步：AGP 需要「JDK 21 +
  # setup-android 基线包（platforms;android-36/build-tools;36.0.0）+ compileSdk 37 由
  # AGP 构建期自动装配」这套口径——那是 android-quality / release-android 已在 ubuntu
  # 上跑通并实证过的组合（SP-238：显式 pin android-37 会因未进 stable 渠道必失败）。
  # 本 job 因此是 **ubuntu 腿**；下面另有一条只重算校验和的 windows 腿（R9-B53 / Q61）。
  # 早期这里写过「搬到 windows 上重验一遍只换来长期债」——那句话到 R9-B51 被现读推翻：
  # 版本锁确实跨平台一致，但校验和登记的是各平台**各自落盘**的构件字节，一条腿盖不住两个 runner。
  gradle-relock:
    name: Gradle 重锁（android/ 四模块，STRICT）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event.inputs.ecosystem == 'gradle' || github.event.inputs.ecosystem == 'all' }}
    steps:
      - name: 检出目标分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      # 守卫写在**每个**持写权限的 job 里，不依赖另一个 job 存在（R9-CI-2 同口径：dispatch 输入经
      # env 中转，run 正文里不出现 `${{ }}`）；下面「写回分支」那步再判一次，不依赖本步存在。
      # 守卫排在检出之后，理由与上面 dotnet job 那条一样（脚本要先在 workspace 里存在）。
      - name: 校验目标分支（写回面守卫；与 windows 腿同一份规则）
        shell: bash
        env:
          GRADLE_RELOCK_BRANCH: ${{ github.event.inputs.branch }}
          GUARD_KIND: ${{ github.event.inputs.target_kind }}
        run: |
          set -euo pipefail
          bash scripts/relock_branch_guard.sh gradle "$GUARD_KIND" "$GRADLE_RELOCK_BRANCH"

      - name: 工具链装配（JDK 21 + Gradle 缓存 + Android SDK，两条腿同一 composite action）
        uses: ./.github/actions/gradle-android-toolchain

      - name: Gradle 版本锁重算（按配置集合解析依赖图，同时补录新条目的校验和）
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          # R9-B32（2026-10-12）改掉的设计：本步骤原先抄「CI 各 workflow 的 gradlew 任务清单」，
          # 而 `:app:androidTestUtil` 这类配置**不属于任何任务名称面**——它由 AGP 的 UTP 构建
          # 监听器在依赖图生成时解析。后果实测：gradle-dependency-graph.yml 在 master 连红两次
          # （`is locked but does not have lock state`），而同期每一条 PR 门禁全绿——
          # 「清单抄对了」根本不等价于「锁覆盖全了」。
          # `--write-locks` 只写本次解析过的配置，所以解析面必须按模型的集合定义：
          # resolveAllConfigurations 解析每个 canBeResolved 配置的**依赖图**（锁记的是版本，
          # 不是产物文件），这个集合天然 ⊇ 任何任务清单。
          # R9-B50（台账 Q55）把校验和并进同一条命令：版本与字节是同一批依赖的两面，
          # 分两次跑就是两次都可能只做一半；而 --write-verification-metadata 缺条目时
          # 是**补录**不是判红，正好解开「新版本没有 sha256 ⇒ 所有 gradle 作业红 ⇒ 无人能重锁」
          # 这个先有鸡还是先有蛋（删掉整个 junit 组件块后跑这条命令 BUILD SUCCESSFUL 并把
          # 条目补了回来，实测记在 android/settings.gradle.kts ③）。
          # --refresh-dependencies 不是保守起见：校验和只登记本次真正落盘的字节，而
          # ~/.gradle 的元数据缓存能让一批 parent-pom/BOM 描述文件永不落盘——本地全绿、
          # CI 的干净 runner 当场红 6 个构件（guava-parent、junit-bom×3、
          # kotlin-gradle-plugins-bom×2，配置名 'classpath'，PR #189 实测，两个平台同 6 条）。
          ./gradlew --no-daemon --no-configuration-cache --refresh-dependencies --write-locks --write-verification-metadata sha256 resolveAllConfigurations

      # 校验和的文件面（产物文件集合 + 工具任务面）单源在 composite action 里：
      # 这条命令 ubuntu 腿与 windows 腿都要跑一次（字节面跟平台走，R9-B51 实测），
      # 抄两遍就会漂，而漂移的表现正是「某个平台的字节静默缺失」。
      - name: Gradle 校验和重算（文件面，两条腿共用同一命令）
        uses: ./.github/actions/gradle-checksum-file-face

      - name: 锁覆盖自证（每个可解析配置都要有锁状态）
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          # 写完必须自证：再判一遍「每个可解析配置都有锁状态」——这条与 PR 面用的是同一个任务，
          # 省掉它，漏写的配置就会回到「下一个解析它的作业当场红」的老路上。
          ./gradlew --no-daemon --no-configuration-cache verifyDependencyLockCoverage

      - name: 写回分支（只写 android/，无改动即空跑成功）
        shell: bash
        env:
          RELOCK_BRANCH: ${{ github.event.inputs.branch }}
          RELOCK_RUN_ID: ${{ github.run_id }}
          GUARD_KIND: ${{ github.event.inputs.target_kind }}
        run: |
          # 二次守卫：不依赖第一步的存在——同一份规则再跑一遍
          bash scripts/relock_branch_guard.sh gradle "$GUARD_KIND" "$RELOCK_BRANCH"

          set -euo pipefail
          git config user.name  "aegis-relock-bot"
          git config user.email "relock@localhost"
          # 逐路径 add 且 pathspec 必须真实存在（不用 `|| true`——那个形态第八轮实测过：
          # git 对不存在的 pathspec 直接 fatal 并放弃整条命令，退出码被吞掉后
          # `git diff --cached --quiet` 恒真，job 高高兴兴打印「无差异」收工）。
          for pathspec in android; do
            if [ ! -e "$pathspec" ]; then
              echo "❌ pathspec 不存在：$pathspec——布局变了就改这里，不要静默跳过"
              exit 1
            fi
            git add -A -- "$pathspec"
          done
          if git diff --cached --quiet; then
            echo "✅ 重锁无差异——当前锁已是最新解析结果（这本身就是个结论，不是失败）"
            exit 0
          fi
          # 「有 diff 却没有一把依赖证据」＝写回面错了（比如顺手改了版本目录），不能推。
          # 合法面两类，都是依赖证据：四把 `gradle.lockfile`（版本）与
          # `gradle/verification-metadata.xml`（字节）——R9-B50 起后者与前者同批重算，
          # 守卫只放前者会造出「重锁作业红在自己写回守卫上」的死路。
          locks=0
          metas=0
          while IFS= read -r changed; do
            case "$changed" in
              */gradle.lockfile) locks=$((locks + 1)) ;;
              */gradle/verification-metadata.xml) metas=$((metas + 1)) ;;
              *) echo "❌ 非依赖证据文件出现在纯重锁运行里：$changed"; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          if [ "$locks" -eq 0 ] && [ "$metas" -eq 0 ]; then
            echo "❌ 有 diff 却既没有 gradle.lockfile 也没有 verification-metadata.xml——写回面错了"
            exit 1
          fi
          if [ "$locks" -eq 0 ]; then
            echo "ℹ️ 本次只重算了校验和（版本未变）——这仍是一次合法的依赖变更"
          fi
          git diff --cached --stat
          git commit -m "chore(deps): 重算 Gradle 依赖锁与校验和（Dependency-Retlock dispatch，run $RELOCK_RUN_ID）" -q
          git push origin "HEAD:$RELOCK_BRANCH"
          echo "⚠️ 依赖证据已写入 $RELOCK_BRANCH——请开 PR 人工审 diff 后再合并；"
          echo "   审点：新增/删除的 group:name 是否都来自版本目录那一次变更；"
          echo "   verification-metadata.xml 里新增的 sha256 要能对上上游发布的构件——"
          echo "   「重锁成功」说的是版本与字节都自洽，不是说某个构件被签名信任过。"

  # ── 校验和的 windows 腿（R9-B53 / 台账 Q61）───────────────────────────────────
  # 为什么需要第二条腿、且只跑文件面：`verification-metadata.xml` 登记的是**本次真正落盘的
  # 字节**，而平台相关构件在两个 runner 上落的是不同文件——`aapt2` 的 `-windows.jar` 与
  # `-linux.jar` 是两个不同的 sha256（R9-B51 现读实测）。只有一条 ubuntu 腿时，windows 侧的
  # 新字节靠「某个本机开发者恰好跑过重算」保证，而缺的那一半不会在任何 PR 面变红：
  # 红的是下一个用到它的作业，可能就是 master 上的依赖图作业（R9-B32 的同一位置）。
  # 版本锁**不需要**这条腿：锁记的是解析结果（跨平台一致），只有字节面跟平台走——
  # 所以本 job 不带 --write-locks，也不跑 verifyDependencyLockCoverage。
  # 两条腿串行（needs）不是保守：两个 job 都往同一分支推同一个文件，并发必然互相覆盖。
  gradle-checksum-windows:
    name: Gradle 校验和 windows 腿（只重算字节，不写锁）
    runs-on: windows-2025
    timeout-minutes: 45
    needs: gradle-relock
    if: ${{ github.event.inputs.ecosystem == 'gradle' || github.event.inputs.ecosystem == 'all' }}
    steps:
      # 守卫写在**每个**持写权限的 job 里，不依赖另一个 job 存在（R9-CI-2 同口径）。
      - name: 检出目标分支（ubuntu 腿写回的同一分支，串行才不会互相覆盖）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      # 排在检出之后：守卫是一份仓库脚本，workspace 在 checkout 之前是空的（同 dotnet job 那条注）。
      - name: 校验目标分支（写回面守卫；两个 gradle 腿共用同一份规则）
        shell: bash
        env:
          WINDOWS_LEG_BRANCH: ${{ github.event.inputs.branch }}
          GUARD_KIND: ${{ github.event.inputs.target_kind }}
        run: |
          set -euo pipefail
          bash scripts/relock_branch_guard.sh gradle "$GUARD_KIND" "$WINDOWS_LEG_BRANCH"

      - name: 工具链装配（与 ubuntu 腿同一个 composite action）
        uses: ./.github/actions/gradle-android-toolchain

      - name: Gradle 校验和重算（文件面，命令与 ubuntu 腿同源单份）
        uses: ./.github/actions/gradle-checksum-file-face

      - name: 写回分支（只写 android/ 的校验和文档，无改动即空跑成功）
        shell: bash
        env:
          RELOCK_BRANCH: ${{ github.event.inputs.branch }}
          RELOCK_RUN_ID: ${{ github.run_id }}
          GUARD_KIND: ${{ github.event.inputs.target_kind }}
        run: |
          # 二次守卫：与 ubuntu 腿同源规则；本腿只许写校验和文档（下面的文件守卫判这个）
          bash scripts/relock_branch_guard.sh gradle "$GUARD_KIND" "$RELOCK_BRANCH"

          set -euo pipefail
          git config user.name  "aegis-relock-bot"
          git config user.email "relock@localhost"
          for pathspec in android; do
            if [ ! -e "$pathspec" ]; then
              echo "❌ pathspec 不存在：$pathspec——布局变了就改这里，不要静默跳过"
              exit 1
            fi
            git add -A -- "$pathspec"
          done
          if git diff --cached --quiet; then
            echo "✅ windows 腿无差异——本机与 ubuntu 已覆盖 windows 需要的所有构件字节"
            exit 0
          fi
          # 本 job 只应产出校验和文档：它不带 --write-locks，也不该改锁。
          # 出现锁文件或别的文件的 diff，说明写回面错了（或两条腿在并发跑）。
          metas=0
          while IFS= read -r changed; do
            case "$changed" in
              */gradle/verification-metadata.xml) metas=$((metas + 1)) ;;
              *) echo "❌ windows 腿产出了非校验和文件：$changed（这条腿不带 --write-locks）"; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          if [ "$metas" -eq 0 ]; then
            echo "❌ 有 diff 却没有 verification-metadata.xml——写回面错了"
            exit 1
          fi
          git diff --cached --stat
          git commit -m "chore(deps): 重算 Gradle 校验和的 windows 腿字节（Dependency-Retlock dispatch，run $RELOCK_RUN_ID）" -q
          git push origin "HEAD:$RELOCK_BRANCH"
          echo "⚠️ windows 腿的字节已写入 $RELOCK_BRANCH——与 ubuntu 腿的 diff 一起人工审；"
          echo "   审点：新增的是不是平台相关构件（aapt2 一类），别把「多了一平台」读成「多了一个依赖」。"
