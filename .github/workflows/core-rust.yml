name: Core-Rust
"on":
  push:
    # PY-206（2026-09-26 审计）：push 触发补 paths 过滤——docs 改动不再
    # 全量跑 cargo 门禁（PR 触发面保持不过滤）
    paths:
      - 'core/**'
      # SP-236（2026-10-02 审计·S-32）：cargo-audit composite action 是本
      # workflow 的门禁组成部分——action 自身变更须回验（PR 面已覆盖，此处
      # 补 push 触发面）
      - '.github/actions/cargo-audit/**'
      - '.github/workflows/core-rust.yml'
  pull_request: {}
  workflow_dispatch: {}
  # SP-240（RS-309/I-05，2026-10-02 审计）：weekly schedule 供 fuzz-build-smoke
  # job（仅 schedule + dispatch 触发；push/PR 不跑——见该 job 的 if 门控与
  # cargo-gate 的 schedule 排除）
  schedule:
    - cron: "0 2 * * 1"            # 每周一 02:00 UTC

permissions:
  contents: read


# PY-044..051：同分支重复 push/PR 取消旧运行（节省 runner 与排队）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cargo-gate:
    # SP-240：schedule 触发仅供 fuzz-build-smoke——常跑 cargo 门禁不在
    # weekly 定时里重复（push/PR/dispatch 行为不变）
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core/rust-policy-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (PY-053)
        with:
          workspaces: core/rust-policy-core
      - name: cargo fmt (蓝图阶段 F——cargo fmt 门禁)
        run: cargo fmt --all -- --check
      # SP-183（2026-10-01 审计）：clippy 三口径统一——补 --all-targets
      #（此前 README/CLAUDE 承诺 --all-targets 而 PR 门禁无——测试/bench 目标
      # 逃检；本地实测统一口径 0 警告通过）
      - name: cargo clippy (蓝图——clippy 门禁——-D warnings)
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: cargo test (vectors 差分——与 C#/Kotlin reference 一致)
        run: cargo test --locked --all-features
      # PY-065 同口径：不依赖 runner 预装 python（下一步只跑 stdlib 门禁脚本）
      - name: 安装 Python（UniFFI 绑定面对账用——R9-RS-2）
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Generate Kotlin and Python bindings from locked UniFFI toolchain
        run: |
          cargo build --release --locked
          cargo run --locked --features uniffi-bindgen --bin aegis-uniffi-bindgen -- \
            generate target/release/libaegis_policy_core.so --language kotlin \
            --out-dir target/uniffi-kotlin --no-format
          test -s target/uniffi-kotlin/uniffi/aegis_policy_core/aegis_policy_core.kt
          # R9-RS-2：入库的 Python 绑定此前**没有任何生成面产出它**——只能手跑，
          # 于是 `#[uniffi::export]` 加方法后它静默落后（update_host_denylist 落后六天、
          # 期间零门禁红）。现在同一次构建里权威生成，再拿它跟入库件做导出名对账。
          cargo run --locked --features uniffi-bindgen --bin aegis-uniffi-bindgen -- \
            generate target/release/libaegis_policy_core.so --language python \
            --out-dir target/uniffi-python --no-format
          python ../../scripts/verify_uniffi_binding_surface.py \
            --repo-root ../.. --generated target/uniffi-python/aegis_policy_core.py
      - name: Verify native ABI export
        run: |
          nm -D target/release/libaegis_policy_core.so | grep -F ' T aegis_policy_core_abi_version'
      # PY-171（2026-09-23 审计·V1 核验批）：安装+执行块收敛为 composite action 单源
      - uses: ./.github/actions/cargo-audit

  # SP-240（RS-309/I-05，2026-10-02 审计）：fuzz 编译性每周冒烟——fuzz/
  # target 此前零 CI 覆盖（cargo fuzz 不入常规 test/clippy/fmt 门禁），上游
  # 依赖升级或核心 API 漂移直到有人手跑 cargo fuzz 才暴露。本 job 每周验证
  # 9 target 编译性（不执行 fuzzing——编译性即足以暴露 API/依赖漂移）。
  # 触发面：仅 schedule + workflow_dispatch（push/PR 不跑，常跑门禁时长不变）；
  # continue-on-error: false 显式声明——失败即红。
  fuzz-build-smoke:
    name: cargo fuzz build（9 target 编译性每周验证）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: false
    # cargo-fuzz 的 sanitizer 插桩要 nightly。rust-toolchain.toml 是**目录级** override，
    # 优先级高于 action 设的 default ⇒ 只有 env 能确定压住它（rustup 顺序：+toolchain 参数
    # > RUSTUP_TOOLCHAIN > 文件 override > default）。不写这行，本 job 会拿 1.99.0 去编 fuzz。
    env:
      RUSTUP_TOOLCHAIN: nightly
    defaults:
      run:
        working-directory: core/rust-policy-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          # cargo-fuzz 的 sanitizer 插桩依赖 nightly 编译器能力
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core/rust-policy-core
      - name: Install cargo-fuzz (版本钉 0.13.2——升级随 weekly 批显式 bump)
        # 钉版安装（--locked）保证每周冒烟口径可复现；升级走显式版本 bump
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: cargo fuzz build（编译全部 fuzz target——不执行）
        # fuzz/ 为独立 crate（自带 Cargo.lock）；不加 --locked——fuzz 依赖树
        # 允许随安装解算，编译失败即为门禁信号
        run: cargo fuzz build
