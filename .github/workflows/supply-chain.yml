name: Supply-Chain
"on":
  # SP-242（2026-10-02 审计·S-18）：补周一定时——依赖面 CVE 持续暴露，此前仅
  # push/PR 触发，无人改依赖文件则依赖审计永不重跑（新 CVE 零发现窗口）
  schedule:
    - cron: "0 4 * * 1"            # 每周一 04:00 UTC
  # SP-200（2026-10-01 审计）：push 补 paths 过滤——此前 push: {} 使 docs 等
  # 与依赖面无关的改动也全量跑审计。触发面按扫描输入圈定（PR 保持不过滤）
  push:
    paths:
      - 'requirements-ci.in'
      - 'requirements-ci.txt'
      # 归档栈两份锁/需求（pip-audit 扫描输入）
      - 'legacy/windows-pywebview/requirements-lock.txt'
      - 'legacy/windows-pywebview/requirements-dev.txt'
      # cargo audit / Cargo.lock 面
      - 'core/rust-policy-core/Cargo.lock'
      - 'core/rust-policy-core/Cargo.toml'
      # SBOM 转换器冒烟输入
      - 'release/tools/generate_sbom/**'
      - 'contracts/vectors/update-manifest-valid.json'
      # 审计第六轮（2026-10-03）：validate_release.py 本体入 push 过滤面——
      # 下方 repo-integrity 门禁的脚本自身改动必须在直推路径上也重跑
      - 'validate_release.py'
      - '.github/workflows/supply-chain.yml'
      - '.github/actions/cargo-audit/**'
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read


# PY-044..051：同分支重复 push/PR 取消旧运行（节省 runner 与排队）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (SP-180 更正注记)
        with:
          python-version: '3.12'
          # SP-201（2026-10-01 审计）：pip 缓存三口径统一（contracts 同批改
          # setup-python 内建缓存；此前本 workflow 无缓存）——锁文件驱动键
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: pip-audit (Python 依赖——依赖门禁——失败即阻断)
        # PY-183（2026-09-26 审计）：扫描面此前仅归档栈 requirements-lock——
        # requirements-dev（ruff/bandit/mypy/pytest）与根 requirements-ci
        # （contracts/agent-redteam/supply-chain 工具链，PY-178 建）全在
        # 依赖审计面之外。三份一并对账。
        # SP-216（2026-10-01 审计）：归档栈 requirements-lock 从硬门禁降为
        # 告警——该栈是只读冻结（ADR-009 D4），新 CVE 只会随上游时间累积，
        # 硬门禁将永久阻断 push、逼人对只读归档做"修复"（纪律破坏面大于
        # 风险面——归档栈不随制品发布）。活越树 requirements-ci.txt 保持
        # 硬门禁（工具链在制品链内）。dev 锁维持 PY-183 的告警口径。
        run: |
          # PY-178 完整化：审计工具自身经 requirements-ci.txt hash 锁定安装
          python -m pip install --require-hashes -r requirements-ci.txt -q
          pip-audit -r legacy/windows-pywebview/requirements-lock.txt \
            || echo "::warning::归档栈 requirements-lock 存在已知漏洞（只读冻结不随制品发布——SP-216 降告警，处置走披露通道评估）"
          # SP-228（2026-10-02 审计·S-08）：裸 `|| true` 吞错无痕（审计记录里
          # 看不出"扫了但有洞"）——改 ::warning 结构化告警（与上方
          # requirements-lock 行同口径）；dev 工具链漏洞仅告警——归档栈工具
          # 不随制品发布
          pip-audit -r legacy/windows-pywebview/requirements-dev.txt \
            || echo "::warning::dev 工具链存在已知漏洞（不随制品发布）"
          pip-audit -r requirements-ci.txt
      # SP-246（2026-10-02 审计·S-23）：NuGet 面此前零漏扫（pip-audit / cargo
      # audit 分别覆盖 Python/Rust——三生态只扫两个）。ubuntu runner 上 restore
      # net10.0-windows 工程须显式 EnableWindowsTargeting（WPF 工程默认仅
      # Windows 可 restore）。
      # gradle 漏扫已接（2026-10-03 剩余项批）——gradle-dependency-graph.yml
      # 把 Android 依赖闭包提交 GitHub 依赖图，Dependabot alerts 面生效
      # （11 项告警实证产出）；本文件的 fail-closed 合入门禁保持 pip/cargo/NuGet
      # 三生态，gradle 走 alerts 持续告警通道（互补分工，终态成立）。
      - name: Setup .NET 10 (NuGet 漏扫工具链——SP-246 显式固化，不依赖镜像预装)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: NuGet vulnerability scan (发现已知漏洞即非零退出——fail-closed)
        # .NET 8+ 起 dotnet list package --vulnerable 命中漏洞即返回非零
        # 退出码（--include-transitive 含传递依赖——扫描面为随制品发布的
        # 正典应用工程依赖闭包）
        run: |
          dotnet restore windows/src/Aegis.Windows.App/Aegis.Windows.App.csproj -p:EnableWindowsTargeting=true
          # 云端实证（PR #60 二轮）：dotnet list package 不接受 -p: 选项（打印
          # help 退出 1）——属性经 MSBuild 环境变量通道传入（restore 亦兼容）
          EnableWindowsTargeting=true dotnet list windows/src/Aegis.Windows.App/Aegis.Windows.App.csproj package --vulnerable --include-transitive
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.99.0
      # PY-171（2026-09-23 审计·V1 核验批）：安装+执行块收敛为 composite action 单源
      - uses: ./.github/actions/cargo-audit
      - name: SBOM generation (CycloneDX——随制品存档——依赖门禁证据)
        # PY-166（2026-09-23 审计·V1 核验批）：本步输入是契约测试向量
        # update-manifest-valid.json——验证的是 generate_sbom「清单→CycloneDX」
        # 形态转换器本身，不是生产依赖 SBOM（故组件无 purl/version 依赖字段，
        # 仅承载 artifact 级 name/sha256/platform）。生产依赖 SBOM 由各平台
        # 发布链的 anchore/sbom-action 从真实锁文件生成（见 release-core.yml
        # sbom job 等处）——两回事勿混。
        run: |
          python release/tools/generate_sbom/generate_sbom.py \
            contracts/vectors/update-manifest-valid.json /tmp/sbom.cdx.json
          python -c "import json; json.load(open('/tmp/sbom.cdx.json')); print('✅ SBOM 生成（CycloneDX——依赖门禁证据）')"
