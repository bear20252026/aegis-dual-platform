# Gradle 依赖洞察（诊断工具——2026-10-03 剩余项批）
# 用途：Dependabot alerts 指向传递依赖时（REST API 不暴露依赖路径），在云端
# 解析 build/plugin classpath 与各模块 classpath 闭包，输出包→父链证据。
# 触发：仅手动 dispatch（诊断工具不进常跑门禁；结果读 log）。
name: Gradle-Dependency-Insight

"on":
  workflow_dispatch:
    inputs:
      packages:
        description: '依赖坐标关键字（逗号分隔）'
        required: false
        default: "bouncycastle,bcpkix,jose4j,jdom,httpclient,commons-lang3,logback"

permissions:
  contents: read
  # 现读 Dependabot 告警状态（下面那一步）。只读，不改任何告警。
  security-events: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  insight:
    name: 依赖路径洞察
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    env:
      # 逗号清单 → grep 交替正则（首跑实证：原始逗号串是字面量匹配，判定全废）
      PKG_REGEX: bouncycastle|bcpkix|jose4j|jdom|httpclient|commons-lang3|logback
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)

      - name: 安装 JDK 21（AGP 9.4.1 要求 ≥17）
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1 (SP-178 重 pin)
        with:
          distribution: temurin
          java-version: "21"

      - name: 设置 Android SDK（基线包——android-quality 同口径）
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4 (SP-178 重 pin)
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: 构建类路径闭包（buildEnvironment——插件/AGP 传递树）
        run: |
          ./gradlew buildEnvironment --no-daemon > /tmp/build-env.txt
          echo "=== build classpath 命中（含上下文父链） ==="
          grep -nE -B3 "$PKG_REGEX" /tmp/build-env.txt || echo "(零命中)"

      - name: 产品运行时闭包（debugRuntimeClasspath——APK 暴露面证明）
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon > /tmp/runtime.txt
          echo "=== runtime 命中 ==="
          grep -nE "$PKG_REGEX" /tmp/runtime.txt || echo "(零命中——产品运行时不暴露)"

      - name: 测试类路径闭包（单元测试 runtime——工具链暴露面；AGP 9 配置名自适配）
        run: |
          CFG=""
          for cand in debugUnitTestRuntimeClasspath testDebugUnitTestRuntimeClasspath; do
            if ./gradlew :app:dependencies --configuration "$cand" --no-daemon > /tmp/testcp.txt; then
              CFG="$cand"; break
            fi
          done
          [ -n "$CFG" ] || { echo "FAIL: 未找到单元测试 runtime 配置"; exit 1; }
          echo "=== test classpath（$CFG）命中 ==="
          grep -nE -B3 "$PKG_REGEX" /tmp/testcp.txt || echo "(零命中)"

      # R9-B49：这条诊断流此前只扫三条面（buildEnvironment / debugRuntimeClasspath /
      # debugUnitTestRuntimeClasspath），而分诊文档里那 9 条 Maven 告警的落点恰恰是
      # **两条工具面**（AGP 的 androidLintTool、ktlint-cli 的 ktlint 配置）。
      # 少扫这两条面，就让「logback 不在本仓任何解析树内」这句失实陈述活了下来
      # （锁文件里 logback-core:1.3.16=ktlint 一直在）。补上，且按 STRICT 锁的口径
      # 从锁文件现读，而不是再依赖一次 gradlew 解析（快，且与入库锁同源）。
      - name: 工具类路径闭包（androidLintTool / ktlint——9 条告警的真实落点）
        run: |
          echo "=== 四把锁里命中工具的坐标 → configuration 归属 ==="
          grep -HnE "$PKG_REGEX" android/*/gradle.lockfile || echo "(零命中)"
          echo "=== 每条命中所在的 configuration（出货面判定依据）==="
          grep -hE "$PKG_REGEX" android/*/gradle.lockfile \
            | awk -F'[=,]' '{for (i = 3; i <= NF; i++) print $i}' | sort -u
          echo "=== 出货/装机面（release|debug Runtime|Compile Classpath、androidTest）里有没有它们 ==="
          python scripts/verify_gradle_alert_scope_boundary.py

      # 为什么要现读告警状态：R9-B49 在 2026-10-13 16:15Z 回读过 `open=0 / dismissed=9`，
      # 而 2026-10-14 07:09Z（PR #197 并入触发的下一次扫描）再读已经是 `open=9 / dismissed=0`。
      # **dismiss 不是持久事实**：只要该 vulnerable 版本仍在依赖图里可解析——
      # `bcprov-jdk18on:1.80.2=androidLintTool` 仍落在告警的 `< 1.85` / `< 1.84` 区间内——
      # 下一次扫描就会把它重开。所以这里**只输出、不判定**：PR 面去判服务端状态＝随机红灯，
      # 而真正能红的判据是上面那条（它判「坐标落在哪条 configuration」，那才是 dismiss
      # 理由的事实基础，且不会因为 GitHub 重开告警而失效）。
      - name: 告警状态现读（只报不判——重开是 GitHub 的正常行为）
        continue-on-error: true   # 诊断面：API 权限或瞬态失败不该让整条洞察失败
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for st in open dismissed fixed; do
            printf 'state=%-9s ' "$st"
            gh api "repos/$GITHUB_REPOSITORY/dependabot/alerts?per_page=100&state=$st" --jq 'length'
          done
          echo "=== 逐条 open（包名 / 受影响范围 / 首个修复版 / 最后更新时间）==="
          gh api "repos/$GITHUB_REPOSITORY/dependabot/alerts?per_page=100&state=open" \
            --jq '.[] | "#\(.number) \(.dependency.package.name) range=\(.security_vulnerability.vulnerable_version_range) patched=\(.security_vulnerability.first_patched_version.identifier // "none") updated=\(.updated_at)"'

      - name: 依赖链洞察（dependencyInsight——按需解析两条 classpath）
        env:
          # 审计第六轮（2026-10-03）：PY-181 同型残留——${{ }} 在 shell 解析
          # 之前完成文本替换，dispatch 输入 packages=a"$(id)"b 会在 runner 上
          # 执行任意命令（需仓库写权限才能 dispatch，非外部可达，但属实时
          # 注入面）。改经 env 中转：run: 文本内只有字面 "$PKGS_INPUT"，
          # 输入内容永不进入脚本源码（全量扫描 workflows/** + actions/**
          # 后本行是唯一残留 in-run 表达式）
          PKGS_INPUT: ${{ inputs.packages }}
        run: |
          # "$PKGS_INPUT" 双引号 + 整体作单个词——IFS 拆分仅按逗号，
          # $ ( " 等元字符不被二次解释
          IFS=',' read -ra PKGS <<< "$PKGS_INPUT"
          for pkg in "${PKGS[@]}"; do
            echo "=== insight($pkg) @ debugRuntimeClasspath ==="
            ./gradlew :app:dependencyInsight --configuration debugRuntimeClasspath --dependency "$pkg" --no-daemon 2>&1 | tail -25 || true
          done

      # upload-artifact 拒绝 workspace 外路径——先拷回
      - name: 归集闭包树到 workspace
        if: always()
        run: |
          mkdir -p $GITHUB_WORKSPACE/dependency-trees
          for f in build-env runtime testcp; do
            [ -f /tmp/$f.txt ] && cp /tmp/$f.txt $GITHUB_WORKSPACE/dependency-trees/
          done
      - name: 上传完整闭包树（排障用）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-trees
          path: dependency-trees/
          if-no-files-found: warn
          retention-days: 14
