# Aegis Android 质量门禁（工具链 P0：ktlint + detekt）
# 触发：任意 push / PR / 手动——无 paths: 过滤（审计第六轮 2026-10-03 删除，
# 依 ADR-007 D3「门禁型 workflow 全量常跑」；原注释"对 android/** 的 push"
# 随过滤一并失效）。JDK 21 由下方 setup-java 显式安装
#（temurin——SP-252 注记：原注释"windows-latest 自带 JDK 21 兼容"已失实，
# 工具链不再依赖镜像预装）。使用项目 Gradle 9.8.0 wrapper（SP-252 随手更正：
# 原注释 9.7.0 已漂移）。ktlintCheck + detekt 作为合并门禁，detekt 基线文件
# （detekt-baseline.xml）对遗留项目友好——仅新引入问题失败。
# SP-252（2026-10-02 审计·S-29，2026-10-03 剩余项批落地）：ubuntu-latest 迁移——
# 排队更快/费用减半（2×→1×）。迁移面：gradlew.bat → ./gradlew（android/gradlew
# 已补 git exec bit 100755）、SDK/工具链步骤跨 OS 通用（setup-java/setup-android
# 均官方双平台支持）。
name: Android-Quality

"on":
  # 审计第六轮（2026-10-03）：删除 push 的 paths: 过滤（PY-206 遗留）——
  # ADR-007 D3 把 android-quality 明列为「门禁型」并要求移除全部 paths:
  # 过滤（"paths: 过滤 = 不设防"）。实证漏检面：本 job 的消费输入不止
  # android/**——"Verify shared product version declarations" 步骤执行
  # ../scripts/verify_versions.py 并读 shared/version.properties（两者均不在
  # 旧过滤面内），.github/actions/** 复合动作同样不在——直推只改这些文件时
  # Android 门禁整轮跳过。旧过滤面覆盖 android/** 本身无洞，洞在"其余输入"
  # 侧；PR 触发面原本不过滤，故仅直推路径受影响。取舍：恢复全量常跑
  #（ADR-007 D3 判定省时收益 << 漏检成本，ktlint 长期 FAIL 未被发现即实证）。
  # 分支面保持原样（原 push 无 branches: 限定→任意分支 push 均触发；不得新增
  #  branches 收窄，否则制造新的过滤型漏检）
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read


# PY-044..051：同分支重复 push/PR 取消旧运行（节省 runner 与排队）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-quality:
    name: ktlint + detekt 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)

      # SP-238（2026-10-02 审计）：注释 AGP 9.3→9.4.1 更正（libs.versions.toml
      # 单源 agp = "9.4.1"，原注释已漂移）
      - name: 安装 JDK 21（AGP 9.4.1 要求 ≥17；detekt/ktlint 兼容）
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1 (SP-178 重 pin)
        with:
          distribution: temurin
          java-version: "21"
          # SP-215（2026-10-01 审计）：Gradle 缓存统一为 setup-java cache: gradle
          # 单机制（原下方"缓存 Gradle"步骤删除——两套机制并存漂移）。
          # AD-243/SP-184 口径保留：cache-dependency-path 必含版本目录
          # libs.versions.toml——版本目录变更须失效缓存，升级依赖后不得复用旧包。
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/**
            android/gradle/libs.versions.toml

      - name: 设置 Android SDK（基线包 + AGP 构建期自动装配 compileSdk 37）
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4 (SP-178 重 pin)
        with:
          # SP-238（2026-10-02 审计）+ 云端实证（PR #60 首跑）：platforms;android-37
          # 未进 sdkmanager stable 渠道（Failed to find package），显式 pin 37 必失败；
          # android-37 平台由 AGP 构建期自动装配（setup-android 已预接受许可）——
          # 显式 pin 仅覆盖 platform-tools/build-tools 基线（build-tools 37.0.0 同退回
          # 36.0.0：与平台包同渠道约束），compileSdk=37 与基线包的差集即 AGP 自动装配面
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: ktlint 检查（0 错误门禁）
        run: ./gradlew :app:ktlintCheck :broker:ktlintCheck :webview-adapter:ktlintCheck :contracts:ktlintCheck --no-daemon

      # SP-237（AD-316，2026-10-02 审计）：androidTest 源集此前零编译门禁——
      # 单测步骤只编译 test（JVM）源集，androidTest（instrumented）目录的
      # 语法/依赖错误不会被任何 CI 步骤发现。CI 无模拟器，编译验证即可。
      - name: androidTest 编译门禁（AD-316——CI 无模拟器，编译验证即可）
        run: ./gradlew :app:assembleDebugAndroidTest --no-daemon

      # PY-065：verify_versions 依赖 runner 预装 Python（镜像变更即碎）——显式固化
      - name: 安装 Python（verify_versions 依赖——不再依赖 runner 预装）
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify shared product version declarations
        run: python ../scripts/verify_versions.py

      - name: detekt 检查（基线门禁：仅新问题失败）
        run: ./gradlew :app:detekt :broker:detekt :webview-adapter:detekt :contracts:detekt --no-daemon

      # AD-066（2026-09-24 审计）：Android Lint 门禁此前缺失——安全问题
      # （明文/导出组件/备份等）零拦截。新引入错误失败；存量问题如有噪音
      # 走 lint baseline（app/lint-baseline.xml）收敛。
      - name: Android Lint 门禁（:app:lintDebug）
        run: ./gradlew :app:lintDebug --no-daemon

      - name: 单元测试（broker 授权生命周期 + app 搜索归一 + webview-adapter 客户端状态机）
        run: ./gradlew :broker:testDebugUnitTest :app:testDebugUnitTest :webview-adapter:testDebugUnitTest --no-daemon

      - name: 上传 detekt 报告（排障用——PY-066 四模块聚合）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: detekt-report
          path: |
            android/app/build/reports/detekt/
            android/broker/build/reports/detekt/
            android/webview-adapter/build/reports/detekt/
            android/contracts/build/reports/detekt/
          if-no-files-found: warn
          # SP-253（2026-10-02 审计·S-30）：排障类制品统一 14 天留存
          retention-days: 14
