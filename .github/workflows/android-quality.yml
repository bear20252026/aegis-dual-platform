# Aegis Android 质量门禁（工具链 P0：ktlint + detekt）
# 触发：对 android/** 的 push / PR / 手动。windows-latest 自带 JDK 21 兼容，
# 使用项目 Gradle 9.7.0 wrapper。ktlintCheck + detekt 作为合并门禁，
# detekt 基线文件（detekt-baseline.xml）对遗留项目友好——仅新引入问题失败。
name: Android-Quality

"on":
  push:
    # PY-206（2026-09-26 审计）：push 触发补 paths 过滤——docs 改动不再
    # 全量跑 Gradle 门禁（PR 触发面保持不过滤）
    paths:
      - 'android/**'
      - '.github/workflows/android-quality.yml'
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read


# PY-044..051：同分支重复 push/PR 取消旧运行（节省 runner 与排队）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-quality:
    name: ktlint + detekt 质量门禁
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)

      - name: 安装 JDK 21（AGP 9.3 要求 ≥17；detekt/ktlint 兼容）
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1 (SP-178 重 pin)
        with:
          distribution: temurin
          java-version: "21"
          # SP-215（2026-10-01 审计）：Gradle 缓存统一为 setup-java cache: gradle
          # 单机制（原下方"缓存 Gradle"步骤删除——两套机制并存漂移）。
          # AD-243/SP-184 口径保留：cache-dependency-path 必含版本目录
          # libs.versions.toml——版本目录变更须失效缓存，升级依赖后不得复用旧包。
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/**
            android/gradle/libs.versions.toml

      - name: 设置 Android SDK（API 36）
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4 (SP-178 重 pin)
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: ktlint 检查（0 错误门禁）
        run: ./gradlew.bat :app:ktlintCheck :broker:ktlintCheck :webview-adapter:ktlintCheck :contracts:ktlintCheck --no-daemon

      # PY-065：verify_versions 依赖 runner 预装 Python（镜像变更即碎）——显式固化
      - name: 安装 Python（verify_versions 依赖——不再依赖 runner 预装）
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify shared product version declarations
        run: python ../scripts/verify_versions.py

      - name: detekt 检查（基线门禁：仅新问题失败）
        run: ./gradlew.bat :app:detekt :broker:detekt :webview-adapter:detekt :contracts:detekt --no-daemon

      # AD-066（2026-09-24 审计）：Android Lint 门禁此前缺失——安全问题
      # （明文/导出组件/备份等）零拦截。新引入错误失败；存量问题如有噪音
      # 走 lint baseline（app/lint-baseline.xml）收敛。
      - name: Android Lint 门禁（:app:lintDebug）
        run: ./gradlew.bat :app:lintDebug --no-daemon

      - name: 单元测试（broker 授权生命周期 + app 搜索归一 + webview-adapter 客户端状态机）
        run: ./gradlew.bat :broker:testDebugUnitTest :app:testDebugUnitTest :webview-adapter:testDebugUnitTest --no-daemon

      - name: 上传 detekt 报告（排障用——PY-066 四模块聚合）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: detekt-report
          path: |
            android/app/build/reports/detekt/
            android/broker/build/reports/detekt/
            android/webview-adapter/build/reports/detekt/
            android/contracts/build/reports/detekt/
          if-no-files-found: warn
