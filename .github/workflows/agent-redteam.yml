name: Agent-Redteam
"on":
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read


# PY-044..051：同分支重复 push/PR 取消旧运行（节省 runner 与排队）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (node24)
        with:
          python-version: '3.12'
      - name: Install test deps (PY-020 锁版+单次安装——此前重复裸装)
        # SP-171（2026-09-26 审计）：测试执行改单跑 pytest——pytest 一并锁版安装
        run: python -m pip install "pyyaml==6.0.2" "pytest==8.3.4" -q
      # SP-171（2026-09-26 审计）：删除此前两条直跑脚本步骤与内联 yaml 断言块
      # （内联块是 redteam_test.py catalog 校验的弱化复刻——校验双源），改为
      # 单跑 pytest：自动收集 redteam_test.py / redteam_e2e_test.py 全部用例
      # （含 test_action_catalog_default_deny），同套用例不再双跑
      - name: Red team tests via pytest (提示注入/投毒/重放/预算——阶段 G)
        run: python -m pytest agent/tests -q
      # PY-202（2026-09-26 审计）：heredoc 内联 Python（open 无 close、结构
      # 变化时 KeyError 原始栈）移出为单源脚本 contracts/codegen/
      # verify_agent_catalog.py——workflow 改调脚本，catalog 门禁保留独立步骤
      - name: Action catalog gate (default_deny——首批只读——Agent 门禁)
        run: python contracts/codegen/verify_agent_catalog.py
