name: Agent-Redteam
"on":
  # SP-200（2026-10-01 审计）：push 补 paths 过滤——此前 push: {} 使 docs 等
  # 改动也全量跑红队测试。触发面按测试输入圈定（PR 保持不过滤）
  push:
    paths:
      - 'agent/**'
      # verify_agent_catalog 消费 action catalog 单源
      - 'contracts/**'
      # pytest 工具链经 requirements-ci.txt hash 锁安装
      - 'requirements-ci.in'
      - 'requirements-ci.txt'
      - '.github/workflows/agent-redteam.yml'
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read


# PY-044..051：同分支重复 push/PR 取消旧运行（节省 runner 与排队）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SP-178 重 pin)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (SP-180 更正注记)
        with:
          python-version: '3.12'
          # SP-201（2026-10-01 审计）：pip 缓存三口径统一（此前本 workflow
          # 无缓存——与 contracts/supply-chain 同批收敛为 setup-python 内建
          # 缓存 + 锁文件驱动键）
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test deps (PY-178 完整化——hash 锁定单源)
        # SP-171（2026-09-26 审计）：测试执行改单跑 pytest——pytest 一并锁版安装。
        # PY-178 收尾批：行内 == pin 改根 requirements-ci.txt --require-hashes
        #（此前 pytest 8.3.4 与本地/其他 workflow 9.1.1 漂移，一并对齐）
        run: python -m pip install --require-hashes -r requirements-ci.txt -q
      # SP-171（2026-09-26 审计）：删除此前两条直跑脚本步骤与内联 yaml 断言块
      # （内联块是 redteam_test.py catalog 校验的弱化复刻——校验双源），改为
      # 单跑 pytest：自动收集 redteam_test.py / redteam_e2e_test.py 全部用例
      # （含 test_action_catalog_default_deny），同套用例不再双跑
      - name: Red team tests via pytest (提示注入/投毒/重放/预算——阶段 G)
        # SP-258（2026-10-02 审计）：--cov 出覆盖率报告（不设阈值，供补测排序）
        run: python -m pytest agent/tests -q --cov=agent --cov-report=term-missing:skip-covered
      # PY-202（2026-09-26 审计）：heredoc 内联 Python（open 无 close、结构
      # 变化时 KeyError 原始栈）移出为单源脚本 contracts/codegen/
      # verify_agent_catalog.py——workflow 改调脚本，catalog 门禁保留独立步骤
      - name: Action catalog gate (default_deny——首批只读——Agent 门禁)
        run: python contracts/codegen/verify_agent_catalog.py
