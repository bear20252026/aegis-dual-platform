name: Agent-Redteam
"on":
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read


# PY-044..051：同分支重复 push/PR 取消旧运行（节省 runner 与排队）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (node24)
        with:
          python-version: '3.12'
      - name: Install test deps (PY-020 锁版+单次安装——此前重复裸装)
        run: python -m pip install "pyyaml==6.0.2" -q
      - name: Red team tests (提示注入/投毒/重放/预算——无未批准副作用——阶段 G)
        run: python agent/tests/redteam_test.py
      - name: Red team E2E tests (审计修复：此前未接入任何 workflow——README/runbook 声称 CI 跑二者)
        run: python agent/tests/redteam_e2e_test.py
      - name: Action catalog validation (default_deny——首批只读——Agent 门禁)
        run: |
          python - <<'PYEOF'
          import yaml
          c = yaml.safe_load(open('contracts/policy/action-catalog.yaml', encoding='utf-8'))
          assert c['default_deny'] is True
          assert all(a['read_only'] for a in c['actions'])
          print('✅ action-catalog default_deny + 首批只读——Agent 门禁闭合')
          PYEOF
