<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aegis 新标签页</title>
<!-- CSP（审计 I83 收口）：此前内联脚本/内联事件处理器依赖「受信壳页」假设。
     现全部脚本外置（start.js/start.snake.js/start.import.js/start.main.js），
     事件绑定经 addEventListener——script-src 'self' 禁内联后仍有完整行为。
     file: 许可：Android 以 file:///android_asset/ 加载本页，file: 文档对
     'self' 的匹配依引擎而异——显式放行本地文件（https 页面引用 file:
     子资源本就被浏览器拦截，此许可实际只作用于 Android 本地资产）。
     connect-src 'none'：页面自身零网络请求（数据全走宿主桥）。 -->
<!-- WB-105（2026-09-26 审计）：frame-ancestors 指令从 meta CSP 移除——规范
     明文规定该指令（连同 report-uri）在 <meta> 中被忽略，保留即为「安全声明
     失真」（防嵌套保护实际不存在）。防嵌套由 WebView 容器承担：C# 栈页面仅
     经 ntp.aegis.local 受信虚拟主机加载，宿主桥按顶层文档门禁
     （NtpAssets.IsTopLevelNtpDocument）拒绝帧内嵌复用；Android 为本地
     asset 页，无第三方嵌入面。 -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file: data:; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <!-- WB-131（2026-09-26 审计）：data: URI favicon——此前 head 无任何 icon
         声明且虚拟主机根无 favicon.ico，每开新标签产生一次 404 子资源请求
         （img-src 已放行 data:，meta CSP 下可加载） -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23152038'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='19' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="start.css">
</head>
<body>
  <div id="wallpaper"></div>

  <div class="center">
    <div class="logo">A</div>
    <h1>Aegis 安全浏览器</h1>
    <div class="search">
      <div class="engine-wrap">
        <div class="engine-pill" id="enginePill" title="切换搜索引擎" role="button" tabindex="0"
             aria-haspopup="menu" aria-expanded="false" aria-controls="engineMenu">
          <span class="dot"></span><span id="engineName">百度</span><span class="caret" aria-hidden="true">▾</span>
        </div>
        <!-- WB-028：role=menu 与触发器的 aria-controls 配对（菜单项为
             menuitemradio——renderEngineMenu 动态构建） -->
        <div class="engine-menu" id="engineMenu" role="menu"></div>
      </div>
      <!-- form+submit：兼容移动端 IME「搜索/前往」action（不走 keydown Enter；
           submit 与按钮点击双路径绑定在 start.main.js——BUG-009 保底） -->
      <form id="searchForm">
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" aria-label="搜索网页或输入网址"
             placeholder="搜索网页或输入网址…" autofocus>
      <button type="button" id="searchBtn">搜索</button>
      </form>
    </div>
    <!-- 几何画板快捷入口（离线 GeoGebra——点击跳转内置画板页） -->
    <div class="quick-row">
      <button id="snakeBtn" class="quick-btn" title="贪吃蛇小游戏 · 离线可玩">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5h-9a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6H4"/><circle cx="20.2" cy="5" r="1.4" fill="currentColor" stroke="none"/></svg></span><span>贪吃蛇</span>
      </button>
      <button id="geoBtn" class="quick-btn" title="离线几何画板 · 无需网络">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 21 20H3z"/><path d="M12 11v4.5"/><path d="M9.8 13.2h4.4"/></svg></span><span>几何画板</span>
      </button>
    </div>
    <div class="bookmarks" id="bm"></div>
    <div id="restoreBox" class="restore-box" hidden>
      <button id="restoreBtn" class="restore-btn">恢复上次会话</button>
    </div>
    <div class="import-entry-wrap">
      <button id="importEntry" class="link-btn">从 Chrome / Edge 导入书签与历史</button>
    </div>
  </div>

  <!-- 导入向导弹层（步骤内容全部由 JS 以 textContent 构建——R-06） -->
  <div id="importModal" role="dialog" aria-modal="true" aria-label="从 Chrome 或 Edge 导入" hidden>
    <div class="im-card">
      <div class="im-title">从 Chrome / Edge 导入</div>
      <!-- WB-113（2026-09-26 审计）：向导步骤文案（扫描中→导入中→完成/失败）
           此前仅视觉呈现——role=status + aria-live=polite 让读屏播报步骤变化
           （polite：不打断用户当前朗读） -->
      <div id="imBody" role="status" aria-live="polite"></div>
      <div class="im-actions">
        <button id="imClose">关闭</button>
        <button id="imNext">下一步</button>
      </div>
    </div>
  </div>

  <!-- 壁纸切换 -->
  <div class="wallpapers">
    <span class="wp-label">壁纸</span>
    <div id="wpList"></div>
  </div>
  <div class="footer">Enter 打开 · Ctrl+L 聚焦地址栏</div>


  <!-- 贪吃蛇（暖阳像素：金色时刻 · 温暖正面——双端统一单源） -->
  <!-- WB-112（2026-09-26 审计）：全屏浮层补 dialog 语义——role=dialog +
       aria-modal + aria-label（对齐导入向导）；初始隐藏由 CSS display:none
       承担，焦点管理（打开聚焦关闭钮/Tab 陷阱/关闭归还）在 start.snake.js -->
  <div class="snake-overlay" id="snakeOverlay" role="dialog" aria-modal="true" aria-label="贪吃蛇游戏">
    <div class="snake-panel">
      <div class="snake-head">
        <span class="title">🐍 贪吃蛇</span>
        <div class="chips">
          <span class="chip"><span class="k">得分</span><b id="snakeScore">0</b></span>
          <span class="chip best"><span class="k">最高</span><b id="snakeBest">0</b></span>
        </div>
        <button class="snake-sound" id="snakeSound" title="音效开关" aria-label="音效开关">🔊</button>
        <button class="snake-close" id="snakeClose" title="退出" aria-label="退出游戏">&#10005;</button>
      </div>
      <div class="snake-stage">
        <canvas id="snakeCanvas" width="480" height="480" role="img" aria-label="贪吃蛇游戏画布"></canvas>
        <div class="snake-veil" id="snakeVeil">
          <div class="veil-card">
            <div class="veil-emoji" id="veilEmoji">🌞</div>
            <div class="veil-title" id="veilTitle">准备好出发了吗？</div>
            <div class="veil-sub" id="veilSub">方向键 / WASD / 滑动 · 一路收集阳光果</div>
            <button class="veil-btn" id="veilBtn">出发</button>
          </div>
        </div>
      </div>
      <div class="snake-foot">↑ ↓ ← → 或 WASD 转向 · 空格 暂停 / 出发 · 触屏滑动</div>
    </div>
  </div>

  <!-- 脚本（CSP：全部外部文件——顺序：Host 适配层 → 贪吃蛇 → 导入向导 → 主逻辑/静态绑定） -->
  <script src="start.js"></script>
  <script src="start.snake.js"></script>
  <script src="start.import.js"></script>
  <script src="start.main.js"></script>
</body>
</html>
