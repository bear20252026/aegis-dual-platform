# ruff 配置 —— Aegis WebView 版
# 豁免理由（形式化加固的刻意设计）：
# - BLE001 (blind-except): js_api 桥边界必须兜住一切异常，绝不外泄到 JS/线程，
#   否则单次异常会导致 WebView 崩溃 —— 盲捕在此是安全性要求而非坏味道。
# - S110  (try-except-pass): 降级路径（书签/历史/壁纸不可用）刻意静默，
#   保证"纯浏览"永不因可选功能失败而中断。
# 这两个规则在 main_webview.py 中以显式注释说明，此处统一豁免。
[lint]
ignore = ["BLE001", "S110"]
