# Action Catalog（阶段 G——蓝图 contracts/policy/action-catalog.yaml——逐项复开）

# 依据：蓝图（每增加 action 必须修改 action-catalog——风险等级/scope/预算/
# 确认规则/审计事件/负面红队样例/e2e 测试）+ 全球调研（CSA 工具级 scope 最小
# 权限 + 渐进式 scope 升级——第一批只恢复只读低风险工具）
# 默认拒绝（default-deny）——未登记 action 不可用（蓝图）。

default_deny: true
policy_version: "1.0"

actions:
  # 第一批：只读低风险（蓝图——当前标签标题/非敏感当前 Origin）
  - name: get_current_title
    risk: low
    scope: tabs:read
    read_only: true
    confirmation: none
    audit: true
    redteam_fixtures: [prompt-injection, tool-result-poisoning]

  - name: get_current_origin
    risk: low
    scope: navigation:read
    read_only: true
    confirmation: none
    audit: true
    redteam_fixtures: [prompt-injection, tool-result-poisoning]

  # 待评估（逐步复开——每项需 scope/预算/确认/红队/e2e 完备——蓝图）
  # - name: navigate_preview      # 风险: medium——需确认 + 标签代际绑定
  # - name: download_preview      # 风险: high——需原生确认 + 隔离存储
  # - name: tab_operations        # 风险: medium——需 scope + 来源校验

  # 永久不自动化（蓝图不做清单）
