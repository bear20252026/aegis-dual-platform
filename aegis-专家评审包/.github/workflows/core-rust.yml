name: Core-Rust
"on":
  push: {}
  pull_request: {}
  workflow_dispatch: {}

jobs:
  cargo-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/rust-policy-core
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: cargo fmt (蓝图阶段 F——cargo fmt 门禁)
        run: cargo fmt --all -- --check
      - name: cargo clippy (蓝图——clippy 门禁——-D warnings)
        run: cargo clippy --locked --all-features -- -D warnings
      - name: cargo test (vectors 差分——与 C#/Kotlin reference 一致)
        run: cargo test --locked --all-features
      - name: Generate Kotlin bindings from locked UniFFI toolchain
        run: |
          cargo build --release --locked
          cargo run --locked --features uniffi-bindgen --bin aegis-uniffi-bindgen -- \
            generate target/release/libaegis_policy_core.so --language kotlin \
            --out-dir target/uniffi-kotlin --no-format
          test -s target/uniffi-kotlin/uniffi/aegis_policy_core/aegis_policy_core.kt
      - name: Verify native ABI export
        run: |
          nm -D target/release/libaegis_policy_core.so | grep -F ' T aegis_policy_core_abi_version'
      - name: cargo audit (Rust 依赖审计——供应链门禁)
        run: |
          cargo install cargo-audit --locked
          cargo audit
