# ruff 配置（中文项目——全角标点规范——按历史 RUF002 先例）
# 依据：日志定位（旧壳 RUF001/RUF003 全角 CJK 标点 + E501 长行——中文注释/字符串
# 用全角标点（（） ， ：）是规范——误报——忽略）+ 蓝图迁移表（旧壳 windows/aegis_source
# 淘汰——extend-exclude——不参与质量门禁——新架构代码继续）
[tool.ruff]
# PY-151（2026-09-23 审计·V1 核验批）：target-version 与 CI/工具链 Python 3.12 对齐
target-version = "py312"
# PY-150（2026-09-23 审计·V1 核验批）：删除 line-length=120——E501 全局忽略且
# 仓库无 ruff format 消费，该值是死配置，徒然暗示存在并未执行的行宽策略；
# 归档栈实测 106 处长行，行宽门禁整体不设（若日后启用 E501 再显式定宽）。
# 旧壳（蓝图迁移表淘汰——api_bridge 删除/bridge_hooks 删除/shell_adapter 冻结）——
# 配置级排除（比命令行可靠）——新架构代码（contracts/codegen/agent/release/scripts）继续门禁
# SP-098（审计 2026-09-23 清单·SP1 批，同 PY-152）：死排除项删除——
# "windows/aegis_source" 目录已不存在；"legacy/windows-pywebview/legacy"
# 被 "legacy" 整树排除覆盖（子集冗余）
extend-exclude = ["legacy"]

[tool.ruff.lint]
# PY-238（2026-10-01 审计）：显式 select 固定规则面——此前无 select（默认
# 面随 ruff 版本漂移：版本升级即静默扩/缩门禁面）。构成：
# - E4/E7/E9/F 前缀整族（pycodestyle error 级 + pyflakes 全族——真错误类
#   完整保留，F401/F811/F841 等不因固定面而丢失）；
# - 其余为 2026-10-01 根口径实测默认面违规规则族的码级快照（新增规则
#   不再随 ruff 升级自动入面——扩面须显式改本清单）。
select = [
    "E4", "E7", "E9",  # pycodestyle error 级（E402/E501 经 ignore 豁免）
    "F",               # pyflakes 全族（F401/F811/F821/F841…）
    "I001",            # unsorted-imports
    "RUF100",          # unused-noqa
    "RUF012",          # mutable-class-default
    "RUF022",          # unsorted-dunder-all
    "PLW1510",         # subprocess-run-without-check
    "UP032",           # f-string
    "UP045",           # non-pep604-annotation-optional
    "SIM103",          # needless-bool
    "SIM208",          # double-negation
    "BLE001",          # blind-except（FFI/验证脚本边界以行内 noqa 显式豁免）
    "PIE790",          # unnecessary-placeholder
]
# 中文项目：全角标点（RUF001/RUF003）忽略（按历史 RUF002 先例）+ 中文长行（E501——
# 中文注释/文档串行宽不可控，PY-150 收口后行宽策略整体退场）——风格类
# （TRY300/TRY003/TRY301/RUF021/E402）无真 bug——按日志分析（86 个非全角全是
# 风格/格式类——不阻塞发布）
# PY-154（2026-09-23 审计·V1 核验批）：I001 移出全局忽略——实测活跃四目录与
# 归档栈（legacy guard 口径）import 排序违规均为 0，重启零成本
ignore = ["RUF001", "RUF003", "E501", "TRY300", "TRY003", "TRY301", "RUF021", "E402"]

# SP-164（2026-09-26 审计）：测试豁免单源——此前 INP001/S101/PLR2004 在
# workflow ruff 行内 --ignore 重复维护（与全局 ignore 清单双源漂移面）。
# INP001 隐式命名空间包（测试目录无需 __init__.py）、S101 assert（测试语义）、
# PLR2004 魔法值（断言可读性优先）。
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001", "S101", "PLR2004"]
"agent/tests/**" = ["INP001", "S101", "PLR2004"]
# PY-239（2026-10-01 审计）：删除 "**/selftest_*.py" 豁免——全仓 selftest_*.py
# 均在 legacy/windows-pywebview/（已被 extend-exclude = ["legacy"] 整树排除），
# 该条目永无匹配文件（死配置）。若日后 selftest 回归活跃树，按需重加。

# PY-149：pytest 基建（tests/python/ ——发布链离线单测落位）
[tool.pytest.ini_options]
testpaths = ["tests/python"]
