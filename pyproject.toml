# ruff 配置（中文项目——全角标点规范——按历史 RUF002 先例）
# 依据：日志定位（旧壳 RUF001/RUF003 全角 CJK 标点 + E501 长行——中文注释/字符串
# 用全角标点（（） ， ：）是规范——误报——忽略）+ 蓝图迁移表（旧壳 windows/aegis_source
# 淘汰——extend-exclude——不参与质量门禁——新架构代码继续）
[tool.ruff]
line-length = 88
# 中文项目：全角标点（RUF001/RUF003）+ 中文长行（E501）忽略（按历史 RUF002 先例——
# 中文 docstring 全角字符触发 RUF select——中文项目忽略恢复门禁）
ignore = ["RUF001", "RUF003", "E501"]
# 旧壳（蓝图迁移表淘汰——api_bridge 删除/bridge_hooks 删除/shell_adapter 冻结）——
# 配置级排除（比命令行可靠）——新架构代码（contracts/codegen/agent/release/scripts）继续门禁
extend-exclude = ["legacy", "windows/aegis_source"]
