[package]
name = "aegis-policy-core"
version = "0.1.0"
edition = "2021"
description = "Aegis 纯策略核心（蓝图阶段 F——Rust 试点——无 UI/网络/文件——纯函数依赖注入）"
license = "MIT"

# UniFFI 跨语言绑定（官方要求——proc-macro 模式）
# cdylib 供 C#/Kotlin/Python 通过 FFI 调用；rlib 供 Rust 测试/内部引用
[lib]
crate-type = ["cdylib", "rlib"]

[features]
uniffi-bindgen = ["uniffi/cli"]

[[bin]]
name = "aegis-uniffi-bindgen"
path = "src/bin/aegis_uniffi_bindgen.rs"
required-features = ["uniffi-bindgen"]

[dependencies]
# 最小 crate 依赖（蓝图：最小依赖 + 固定 toolchain + cargo audit/deny——CI 门禁）
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
getrandom = "0.2"
sha2 = "0.10"
serde_json = "1"
# UniFFI（官方最新 0.32——跨语言绑定生成；proc-macro 模式）
# 不含 cli feature（避免拉入重型 uniffi_bindgen）；bin 需要时单独启用
uniffi = "0.32"

[dev-dependencies]
hex = "0.4"
