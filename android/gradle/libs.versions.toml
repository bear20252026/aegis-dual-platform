# 依赖版本目录（全库审计 2026-09-02 收敛）：此前 webkit 1.15.0 在 app 与
# webview-adapter 双处硬编码、junit 4.13.2 三处复制、ktlint 1.8.0 四处散落
# ——升级时漏改任一处即产生隐性版本漂移。统一在此登记，构建脚本经
# libs.xxx 访问（Gradle 自动加载本文件）。

[versions]
# AD-242（2026-09-26 审计）：插件版本入 catalog 单源——root build.gradle.kts
# 此前字面量散落（AD-154 只收敛了 app 依赖）
agp = "9.3.1"
kotlinComposePlugin = "2.4.10"
gradleKtlintPlugin = "14.2.0"
detektPlugin = "1.23.8"
# AndroidX
androidx-webview = "1.15.0"
androidx-activityCompose = "1.13.0"
androidx-lifecycleRuntimeCompose = "2.10.0"
composeBom = "2026.06.00"
# 工具链
ktlint = "1.8.0"
# 第三方
kotlinxDatetime = "0.8.0"
# jna：登记为文档单源（broker 的 @aar 分类器依赖无法走 catalog，字面量需与此同步）
# AD-099（审计 2026-09-23 清单·A6 批）：5.12.0 → 5.19.1 升级回归（broker 单测门禁）
jna = "5.19.1"
orgJson = "20230227"
junit = "4.13.2"
# mockito 5 默认 inline mock maker——可 mock Kotlin final 类（WebView 等）
mockito = "5.14.2"
# AD-055（2026-09-24 审计）：BrowserEngine 硬化标志 Robolectric 逐项回归
robolectric = "4.14.1"
androidxTestCore = "1.6.1"
# AD-067（2026-09-24 审计）：androidTest 冒烟集运行依赖
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.2.1"

[libraries]
androidx-webview = { module = "androidx.webkit:webkit", version.ref = "androidx-webview" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycleRuntimeCompose" }
# AD-068（2026-09-24 审计）：Compose BOM 入 catalog（app 模块此前字面量硬编码）
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
# AD-154（审计 2026-09-23 清单·A7 批）：Compose BOM 管辖的制品坐标入 catalog
# （app 模块此前以坐标字面量引用；无版本号——版本由上方 compose-bom 单源裁决）
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
junit = { module = "junit:junit", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

# AD-242（2026-09-26 审计）：插件坐标入 catalog（root 经 alias 引用统一注入
# 版本；模块侧 id(...) 沿用——版本解析来自根 plugins 块）
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinComposePlugin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "gradleKtlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detektPlugin" }
