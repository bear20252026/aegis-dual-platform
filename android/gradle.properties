org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AD-287（2026-10-01 审计）：构建性能开关显式启用——
# ① parallel：多模块（app/broker/webview-adapter/contracts）任务级并行；
# ② caching（build cache）：跨变体/跨 CI 运行复用任务输出；
# ③ configuration-cache：配置阶段结果复用（Gradle 9.8 对 AGP 9.4 已稳定支持，
#   门禁任务 ktlint/detekt/test 均可命中缓存）。
# 启用后经门禁（ktlint/detekt/testDebugUnitTest）回归验证；若第三方插件
# 报配置缓存不兼容，优先在插件侧排除（-Dorg.gradle.configuration-cache.problems=warn）
# 而非全局关闭。
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AD-295（2026-10-02 发布实证，v2.2.0-beta.51 真机闪退）：R8 full mode 再次
# 折叠可空性语义（AD-003 同族第二例）——BrowserViewModel.tabManager 可空
# 字段的 init 写入与组合期读取被优化错位，AddressAndContent:261 requireNotNull
# 首帧即崩（模拟器 x86_64 minified release 复现；-Pandroid.enableR8.fullMode=false
# 同代码即存活，UI 完整渲染）。代码级精修（ pinpoint 被折叠的 store/load 对）
# 登记后续批；现以关闭 full mode 换发布正确性（minification 保留）。
android.enableR8.fullMode=false

# 依赖校验（R9-B50 / 台账 Q55，2026-10-13 启用）：解析树里每个构件的字节必须匹配
# gradle/verification-metadata.xml 登记的 sha256，对不上就构建失败。
# 与 STRICT 版本锁是两把不同的刀：锁管「解析到哪个版本」，本行管「那个版本的字节有没有
# 被换过」——只有前者时，一个被上游替换过的同版本构件照样能进包。
# 机制、覆盖面口径与重算规程的单源在 settings.gradle.kts 的决策记录 ③；执行面是
# dependency-relock.yml 的 gradle 生态（同一步里连着 --write-locks 一起重算）。
# 新版本依赖没有条目时**不要**把本行改成 off/lenient 来绕红灯——那一步该重算校验和。
org.gradle.dependency.verification=strict
