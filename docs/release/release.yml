# release.yml —— Aegis 发布 workflow 草稿（B4 实施，发布期——与 ci.yml 分离）
# 发布期实施产物（docs/release/——不触碰开发分支）
# 基于全球调研（sigstore-python 官方 release.yml + ADR 0014 + Shaken Fist + 腾讯云）
# 使用前：①配置 GitHub Environment "release"（required reviewer）
#        ②配置受保护 v* 标签规则集 ③PyPI Trusted Publisher 指向本 workflow

name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:                       # Job 1：构建（B1 混淆隔离 + B3 SBOM）
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install pyarmor nuitka cyclonedx-bom
      - name: Build release artifacts (B1 obfuscation isolation)
        run: python docs/release/build_release.py
      - name: Generate SBOM (B3)
        run: |
          cyclonedx-py requirements windows/aegis_source/requirements.txt \
            -o dist/sbom-aegis.json
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          retention-days: 90

  sign:                        # Job 2：签名（B2 sigstore——官方 action + ambient OIDC）
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # OIDC 地基（sigstore 签名必需——最小权限）
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      # 官方 action（sigstore/gh-action-sigstore-python@v3.4.0）——
      # 替代 python -m sigstore 手动签名；verify: true 签名后即验
      # （smoke test——确认签名产物生成 + Rekor 提交）
      - name: Sign artifacts (sigstore keyless)
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: |
            dist/core/*.pyd
            dist/obfuscated/*.py
          verify: true
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          verify-cert-identity: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          upload-signing-artifacts: true
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-signed
          path: dist/

  publish:                     # Job 3：发布（受保护环境审批 + Trusted Publishing）
    needs: sign
    runs-on: ubuntu-latest
    environment: release       # 受保护 Environment（required reviewer）
    permissions:
      id-token: write          # OIDC Trusted Publishing
      contents: write          # gh release create
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-signed
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
      # （可选）PyPI 发布：pypa/gh-action-pypi-publish（Trusted Publishing——
      #   OIDC 无 API token）
      # Trusted Publishing 配置要点（lhx-kit 实战——易错点）：
      #   1. 本 workflow 文件名（release.yml）须与 PyPI/npm Trusted
      #      Publisher 配置的 Workflow filename 完全一致（含 .yml 扩展名）
      #   2. 只填仓库短名（不带 URL）；Environment 留空（除非 workflow
      #      用了 environment: 块）
      #   3. id-token: write 是 OIDC 地基——缺失则发布 401
