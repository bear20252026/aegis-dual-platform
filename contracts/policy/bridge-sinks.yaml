# Aegis Bridge 守卫拦截点清单（gate-owned 单一事实源）
#
# 审计第六轮（2026-10-03）：本清单原存活于
#   contracts/schemas/bridge_guard.template.js 头部注释「// REQUIRED_SINKS:」行内，
#   verify_bridge_guard.py 再自该行解析、回比对同一模板——即「被证明物自证其检查清
#   单」。把某个 hook 实现连同其锚点 token 一并删除，门禁恒绿（PY-236 只堵住了
#   「锚点在、body 无实现」的空心化，堵不住「锚点与实现同删」的整段挖除）。
# 被证明物不得书写自己的检查清单——故清单迁出模板，落于此门禁自有的策略文件。
# 模板演进（新增/删除拦截点）必须同步改本文件，改动位于门禁侧、受版本控制评审，
# 不再是对被认证产物自身的静默编辑。

# 版本：本清单结构版本号（verify_bridge_guard.py 拒绝读取未知大版本）。
version: "1"

# 占位符：模板与两端副本必须同时携带（parity 归一化映射依赖此二者）。
required_placeholders:
  - __AEGIS_HOSTS__
  - __AEGIS_REQUIRE_HTTPS__

# 已实现拦截点（implemented sinks）：门禁双向断言——
#   (a) hook_pattern（正则）必须出现在规范模板 body（剔除锚点行后）——删一个 hook
#       实现即 body 无匹配 → 红；
#   (b) 同一 hook_pattern 必须出现在 Kotlin 内嵌副本（Rust 经 include_str! 直接消费
#       规范文件本身，故 (a) 即覆盖 Rust）；
#   (c) anchor_token 必须出现在模板「// REQUIRED_SINKS:」锚点行的 token 集合内——
#       锚点与实现同删时 (a)/(b) 已红，(c) 再锁死「只删锚点 token、留 body」的反向漂移。
sinks:
  - id: fetch
    desc: window.fetch 包装（顶层 realm）
    anchor_token: "window.fetch = function"
    hook_pattern: "window\\.fetch\\s*=\\s*function"
  - id: xhr_open
    desc: XMLHttpRequest.prototype.open 包装
    anchor_token: "XMLHttpRequest.prototype.open"
    hook_pattern: "XMLHttpRequest\\.prototype\\.open\\s*=\\s*function"
  - id: send_beacon
    desc: navigator.sendBeacon 包装
    anchor_token: "navigator.sendBeacon = function"
    hook_pattern: "navigator\\.sendBeacon\\s*=\\s*function"
  - id: websocket
    desc: window.WebSocket 构造器包装
    anchor_token: "window.WebSocket = function"
    hook_pattern: "window\\.WebSocket\\s*=\\s*function"
  - id: trusted_caller
    desc: 受信调用方判定（自身 hostname ∈ 白名单）
    anchor_token: "trustedCaller"
    hook_pattern: "trustedCaller"
  - id: location_hostname
    desc: 调用方 origin host 读取（trustedCaller/isBridgeTarget 的共同入参）
    anchor_token: "location.hostname"
    hook_pattern: "location\\.hostname"

# 已知缺口 / 越界（known gaps——文档化，非发现）：
# 本清单只断言「已实现的 sink 未被静默挖除」。守卫的真实覆盖面受限于下列形态——
# 它们是结构性盲区，门禁不因其存在而变红，但必须显式登记、防止「四出口即全覆盖」的
# 过度声明。收窄/删除 sinks 会让 (a) 少查一项——那是对门禁自有源文件的评审内改动，
# 由 tests/python/codegen_and_catalog_test.py 的回归锚兜底（清单不得缩水）。
out_of_scope:
  # 同 realm 内未 hook 的出口——页面可绕守卫直达本机 bridge：
  same_realm_unhooked:
    - EventSource
    - "<img src> / <script src> / <iframe src>（GET 型资源装载不经 fetch/XHR）"
    - "<form method=POST action>（表单提交不经 fetch/XHR）"
    - WebTransport
    - RTCPeerConnection
  # 完全未覆盖的 realm——每个 Worker/SharedWorker/ServiceWorker 拥有独立的全局
  # fetch 与 XMLHttpRequest.prototype，主 realm 注入对它们零作用：
  other_realms_unhooked:
    - Worker
    - SharedWorker
    - ServiceWorker
  # 歧义环回 host——isBridgeTarget 仅比对字面 hostname ∈ 白名单，未做 WHATWG host
  # 归一，下列与 127.0.0.1 同解的形态落入「普通站点流量放行」分支（守卫看不见它
  # 打的是本机 bridge）。这是 contracts/vectors/url-origin-invalid.json 已按
  # 「危险=deny」建模的同一歧义类。归一化属模板 body / core 变更（本 agent 无权
  # 触碰），已在 NEEDS-ACTION 登记。
  ambiguous_loopback_hosts:
    - "http://[::1]:P"
    - "http://127.0.0.2:P"
    - "http://127.0.0.53:P"
    - "http://2130706433:P"
    - "http://0x7f000001:P"
    - "http://127.1:P"
    - "http://0177.0.0.1:P"
